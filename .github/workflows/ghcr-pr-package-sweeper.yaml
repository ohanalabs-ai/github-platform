# Scheduled sweeper for PR preview packages left behind in GHCR (`<repo>[/<suffix>]/pr/<N>`).
#
# Why: docker-multiarch-cicd.yaml's pr-delete runs once, on `pull_request: closed`. Before the 2026-11-15 fix it
# built the wrong package name for suffixed images (HTTP 404, swallowed), and any later failure (missing delete
# rights, a cancelled run) also leaves the package forever. This job is the safety net: it lists every container
# package of the org, and for each package named `.../pr/<N>` asks the package's repository whether PR N is closed
# (merged or not); only those are deleted. It NEVER touches a package that does not end in `/pr/<N>` (release
# images are `<repo>[/<suffix>]` with `main-<sha7>` tags), nor a package whose PR is open, unknown or unreadable.
#
# Dry-run is the default for manual runs; the schedule applies. Credential: the `rekorda-engram` GitHub App
# (org variable PACKAGES_APP_ID, org secret PACKAGES_APP_PRIVATE_KEY; App permissions Packages: read + delete,
# Pull requests: read). Without them the job fails loudly: GITHUB_TOKEN cannot list org packages.
name: 🧹 ghcr-pr-package-sweeper
run-name: 🧹 Sweep closed-PR GHCR packages in ${{ inputs.org || github.repository_owner }} (${{ (github.event_name == 'schedule' || inputs.dry-run == false) && 'apply' || 'dry-run' }})

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted without deleting (default true)
        type: boolean
        default: true
      org:
        description: Organization whose packages are swept (default the repository owner)
        type: string
        default: ""
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: true
      org:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ghcr-pr-package-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    name: 🧹 sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ID: ${{ vars.PACKAGES_APP_ID }}
      APP_KEY: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
    steps:
      - name: Mint the package-admin App token
        id: app
        if: ${{ env.APP_ID != '' && env.APP_KEY != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_KEY }}
          owner: ${{ inputs.org || github.repository_owner }}

      - name: Sweep PR packages whose PR is closed
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          ORG: ${{ inputs.org || github.repository_owner }}
          APPLY: ${{ (github.event_name == 'schedule' || inputs.dry-run == false) && 'true' || 'false' }}
          HAVE_APP: ${{ steps.app.outputs.token != '' && 'true' || 'false' }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const org = process.env.ORG;
            const apply = process.env.APPLY === 'true';
            const summary = core.summary.addHeading(`🧹 GHCR PR-package sweeper (${apply ? 'apply' : 'dry-run'})`, 1);
            if (process.env.HAVE_APP !== 'true') {
              summary.addRaw('No App credential (PACKAGES_APP_ID / PACKAGES_APP_PRIVATE_KEY): GITHUB_TOKEN cannot list org packages.', true);
            }
            const rows = [[{data: 'Package', header: true}, {data: 'PR', header: true}, {data: 'Outcome', header: true}]];
            const counts = {deleted: 0, 'would-delete': 0, kept: 0, skipped: 0, failed: 0};
            const prState = new Map();
            try {
              const pkgs = await github.paginate(github.rest.packages.listPackagesForOrganization,
                {org, package_type: 'container', per_page: 100});
              summary.addRaw(`${pkgs.length} container packages in ${org}.`, true);
              for (const pkg of pkgs) {
                const m = pkg.name.match(/^([^/]+)\/(?:.+\/)?pr\/(\d+)$/);
                if (!m) continue; // release image or anything that is not a PR package: never touched
                const repo = pkg.repository?.name || m[1];
                const pr = Number(m[2]);
                const key = `${repo}#${pr}`;
                if (!prState.has(key)) {
                  try {
                    const {data} = await github.rest.pulls.get({owner: org, repo, pull_number: pr});
                    prState.set(key, data.state);
                  } catch (e) {
                    prState.set(key, `unknown:${e.status}`);
                  }
                }
                const st = prState.get(key);
                let outcome;
                if (st !== 'closed') {
                  outcome = st === 'open' ? 'kept (PR open)' : `skipped (PR ${st})`;
                  counts[st === 'open' ? 'kept' : 'skipped']++;
                } else if (!apply) {
                  outcome = 'would delete';
                  counts['would-delete']++;
                } else {
                  try {
                    await github.rest.packages.deletePackageForOrg({org, package_type: 'container', package_name: pkg.name});
                    outcome = 'deleted';
                    counts.deleted++;
                  } catch (e) {
                    outcome = `FAILED HTTP ${e.status}`;
                    counts.failed++;
                    core.error(`Could not delete ${pkg.name}: HTTP ${e.status} ${e.message}`);
                  }
                }
                rows.push([`${pkg.name}`, `${repo}#${pr}`, outcome]);
              }
              summary.addTable(rows).addRaw(`Totals: ${JSON.stringify(counts)}`, true);
              if (counts.failed) core.setFailed(`${counts.failed} package deletion(s) failed`);
            } catch (e) {
              summary.addRaw(`FAILED: HTTP ${e.status} ${e.message}`, true);
              core.setFailed(`Sweep failed: HTTP ${e.status} ${e.message}`);
            } finally {
              await summary.write();
            }
