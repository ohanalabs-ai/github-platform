# 🔄 vault-rotate-secret — the generalized form of ohanalabs-ai/oahana-github
# vionix-vault-rotate-secrets.yaml (vault-action jwt login on `git-jwt` + a base64 CA + `vault read` /
# `openssl rand` / `vault write`), as a reusable any GitHub repo can call with its own Vault role.
# Design: planeodev/planeo-infra docs/vault/github-actions-access.md (Jira INTEGRATE-30).
#
#   🔐 login     GitHub OIDC token (audience `vault-audience`) → auth/<vault-auth-path>/login role <vault-role>
#   📖 read      current KV v2 record <kv-mount>/data/<secret-path> → its version (404 = first rotation)
#   🎲 new       `source: generate` → `length` random bytes (base64|base64url|hex); `source: input` → the
#                `new-value` secret (a credential minted by the downstream system's API in an earlier job)
#   ✍️ write     check-and-set on the version read: a concurrent rotation fails instead of being lost;
#                the previous value stays in KV v2's history (rollback: `vault kv rollback -version=N`)
#   📣 notify    optional repository_dispatch to the system that must reload (payload carries the path +
#                version, NEVER the value — the receiver reads it from Vault with its own role)
#   🗑️ revoke    the Vault token is revoked before the step ends
#
# What changed vs the vionix job, deliberately: no value is ever printed (vionix echoed old + new), no
# Vault CLI container, no token in GITHUB_ENV, the CA is optional (a publicly trusted Vault needs none).
# All logic: actions/vault/{ca,rotate,client}.ts via actions/github-script v8.
name: 🔄 vault-rotate-secret

on:
  workflow_call:
    inputs:
      vault-url:
        description: "Vault base URL, https://"
        type: string
        required: true
      vault-auth-path:
        description: "JWT auth mount that trusts GitHub's OIDC issuer (Planeo tenants: github/<tenant>)"
        type: string
        default: github-jwt
      vault-role:
        description: "Role on that mount (bound to this repository + ref/environment; policy = write on the record)"
        type: string
        required: true
      vault-audience:
        description: "OIDC audience the role's bound_audiences expects (default https://github.com/<owner>)"
        type: string
        default: ""
      ca-certificate:
        description: "Optional base64 PEM of the Vault server's CA"
        type: string
        default: ""
      kv-mount:
        description: "KV v2 mount (Planeo: planeo)"
        type: string
        required: true
      secret-path:
        description: "Record path under the mount (Planeo tenants: customers/<tenant>-<env>/<component>/<record>)"
        type: string
        required: true
      field:
        description: "Field of the record to rotate"
        type: string
        default: value
      source:
        description: "generate | input (the new-value secret)"
        type: string
        default: generate
      length:
        description: "source=generate: random BYTES (16..1024)"
        type: number
        default: 32
      encoding:
        description: "source=generate: base64 | base64url | hex"
        type: string
        default: base64
      keep-fields:
        description: "Keep the record's other fields"
        type: boolean
        default: true
      dispatch-repository:
        description: "Optional owner/name to send a repository_dispatch to after the write"
        type: string
        default: ""
      dispatch-event:
        description: "repository_dispatch event type"
        type: string
        default: vault-secret-rotated
      join-tailscale:
        description: "Join a Tailscale tailnet before reaching Vault (private Vault)"
        type: boolean
        default: false
      tailscale-tags:
        type: string
        default: tag:ci
      runs-on:
        type: string
        default: ubuntu-latest
    secrets:
      new-value:
        description: "source=input: the new value"
        required: false
      dispatch-token:
        description: "Token allowed to create repository_dispatch on dispatch-repository (default: this run's GITHUB_TOKEN, same repo only)"
        required: false
      tailscale-oauth-client-id:
        required: false
      tailscale-oauth-secret:
        required: false
    outputs:
      version:
        description: "New KV version"
        value: ${{ jobs.rotate.outputs.version }}
      previous-version:
        description: "Version that was current before (0 = the record did not exist)"
        value: ${{ jobs.rotate.outputs.previous-version }}
      meter-event:
        description: "CloudEvents JSON usage record (metering hook)"
        value: ${{ jobs.rotate.outputs.meter-event }}

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    name: 🔄 rotate ${{ inputs.kv-mount }}/${{ inputs.secret-path }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.rotate.outputs.version }}
      previous-version: ${{ steps.rotate.outputs.previous-version }}
      meter-event: ${{ steps.rotate.outputs.meter-event }}
    steps:
      - name: 📥 vault actions (this workflow's commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ohanalabs-ai/github-platform
          ref: ${{ job.workflow_sha || github.job_workflow_sha }}
          path: .vault-actions
          sparse-checkout: actions/vault
          persist-credentials: false

      - name: 🪪 custom Vault CA (optional)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CA_B64: ${{ inputs.ca-certificate }}
          CA_FILE: ${{ runner.temp }}/vault-ca.pem
        with:
          script: |
            const { default: run } = await import(`${process.env.GITHUB_WORKSPACE}/.vault-actions/actions/vault/ca.ts`);
            await run({ core, exec, github, context });

      - name: 🔗 join the tailnet (private Vault)
        if: inputs.join-tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.tailscale-oauth-client-id }}
          oauth-secret: ${{ secrets.tailscale-oauth-secret }}
          tags: ${{ inputs.tailscale-tags }}
          args: --accept-routes

      - name: 🔄 login · read · write (cas) · notify · revoke
        id: rotate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NODE_EXTRA_CA_CERTS: ${{ inputs.ca-certificate != '' && format('{0}/vault-ca.pem', runner.temp) || '' }}
          VAULT_URL: ${{ inputs.vault-url }}
          VAULT_AUTH_PATH: ${{ inputs.vault-auth-path }}
          VAULT_ROLE: ${{ inputs.vault-role }}
          VAULT_AUDIENCE: ${{ inputs.vault-audience }}
          KV_MOUNT: ${{ inputs.kv-mount }}
          SECRET_PATH: ${{ inputs.secret-path }}
          FIELD: ${{ inputs.field }}
          SOURCE: ${{ inputs.source }}
          LENGTH: ${{ inputs.length }}
          ENCODING: ${{ inputs.encoding }}
          NEW_VALUE: ${{ secrets.new-value }}
          KEEP_FIELDS: ${{ inputs.keep-fields }}
          OUTPUT_VALUE: "false" # a masked value cannot cross a job boundary anyway — consumers read it from Vault
          DISPATCH_REPOSITORY: ${{ inputs.dispatch-repository }}
          DISPATCH_EVENT: ${{ inputs.dispatch-event }}
        with:
          github-token: ${{ secrets.dispatch-token || github.token }}
          script: |
            const { default: run } = await import(`${process.env.GITHUB_WORKSPACE}/.vault-actions/actions/vault/rotate.ts`);
            await run({ core, exec, github, context });
