# PR security synchronizer — evaluate-and-decide over every Vionix image build + scan of a PR.
#
# WHY A SEPARATE WORKFLOW: per-service image workflows live in DIFFERENT files (one caller per
# compose service — the docker-multiarch-cicd.yaml reusable cannot run in a matrix, its job names
# collide), so there is no shared `needs:` graph. This reusable runs on the same PR, discovers all
# check runs of the head SHA, waits for them, re-classifies them (build / scan / other), downloads
# each scan's Trivy JSON (docker-image-security.yaml's `image-security-report` artifact), posts ONE
# consolidated table (sticky PR comment + job summary), applies the accepted fixes, and DECIDES —
# the failure happens here, in the reusable; callers stay thin (uses: + with: + permissions).
#
# POLL, NOT workflow_run: `workflow_run` only fires from workflow files already on the default
# branch (so it cannot be validated in the PR that introduces it) and each caller would have to
# list every build workflow by name. The poll is bounded (poll-interval-seconds, timeout-minutes),
# excludes this run's own jobs by RUN ID (not by name), and its job-level concurrency group cancels
# an older poller when the PR gets a new push.
#
# FIXES — who does what:
#   commit-go / commit-pip  deterministic language bumps from Trivy's FixedVersion, at or above
#                           `accept-trivy-job-patches`, as ONE commit on the PR branch (Go modules
#                           only if the `go` directive stays within the Dockerfile's golang builder;
#                           pip pins only if pip can still resolve the file).
#   dependabot-lang         npm, maven/gradle, nuget, … and anything not deterministic → Dependabot.
#   dependabot-base-image   Go stdlib (= the golang builder image) and base images → Dependabot
#                           `docker` ecosystem bumps the FROM lines.
#   copa-os                 OS packages → Copa patches the BUILT image (pushed as <repo>:src-<d>-patched)
#                           and re-scans it; Copa never changes the Dockerfile or the PR.
# A commit pushed with GITHUB_TOKEN does NOT trigger new workflow runs: pass a GitHub App
# (secrets SYNC_APP_ID + SYNC_APP_PRIVATE_KEY, contents:write) so the builds re-run on the commit.
name: 🛡️ pr-security-synchronizer

on:
  workflow_call:
    inputs:
      accept-trivy-job-patches:
        description: "Apply fixes for findings at or above: none | critical | high | medium | low"
        type: string
        default: none
      copa:
        description: Patch OS packages of the scanned images with Copa and re-scan them
        type: boolean
        default: false
      build-pattern:
        description: Regex matching build check-run names (default = docker-multiarch-cicd's build jobs)
        type: string
        default: "🏗️ (pr|ref)-build$"
      scan-pattern:
        description: Regex matching scan check-run names (default = docker-image-security's job)
        type: string
        default: "🛡️ image security$"
      ignore-pattern:
        description: Regex of check runs to ignore entirely
        type: string
        default: "(?i)pr-delete|github-release|slsa|🏷️ release"
      docker-compose-file-name:
        description: Compose file mapping service → build context (for the language fixes)
        type: string
        default: docker-compose.yaml
      poll-interval-seconds:
        type: number
        default: 30
      timeout-minutes:
        description: Give up waiting for the other checks after this long
        type: number
        default: 60
      add-pr-comment:
        type: boolean
        default: true
      github-actions-runner:
        type: string
        default: ubuntu-latest
    secrets:
      SYNC_APP_ID:
        description: GitHub App id — its token pushes the fix commit so the builds re-run (optional)
        required: false
      SYNC_APP_PRIVATE_KEY:
        required: false
    outputs:
      status:
        description: "pass | policy-fail"
        value: ${{ jobs.decide.outputs.status }}
      blocking:
        value: ${{ jobs.decide.outputs.blocking }}

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  packages: write

env:
  OUT_DIR: pr-security-sync

jobs:
  collect:
    name: 🔄 collect
    runs-on: ${{ inputs.github-actions-runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: pr-security-sync-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      has_patches: ${{ steps.collect.outputs.has_patches }}
      has_copa: ${{ steps.collect.outputs.has_copa }}
      copa_matrix: ${{ steps.collect.outputs.copa_matrix }}
    steps:
      - name: Checkout the PR (compose file → service build contexts)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Checkout the synchronizer helpers (at this reusable's own commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ohanalabs-ai/github-platform
          ref: ${{ job.workflow_sha || github.job_workflow_sha }}
          path: .pr-security-sync
          sparse-checkout: actions/docker
          persist-credentials: false
      - name: Wait for every build + scan, classify, collect the Trivy JSON
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_PATTERN: ${{ inputs.build-pattern }}
          SCAN_PATTERN: ${{ inputs.scan-pattern }}
          IGNORE_PATTERN: ${{ inputs.ignore-pattern }}
          COMPOSE_FILE: ${{ inputs.docker-compose-file-name }}
          ACCEPT_LEVEL: ${{ inputs.accept-trivy-job-patches }}
          POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: python3 .pr-security-sync/actions/docker/pr-security-sync/sync.py collect
      - name: Upload the consolidated data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-security-sync-collect
          path: ${{ env.OUT_DIR }}
          retention-days: 30

  patch:
    name: 🩹 patch (one commit)
    needs: collect
    if: inputs.accept-trivy-job-patches != 'none' && needs.collect.outputs.has_patches == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.github-actions-runner }}
    env:
      HAS_APP: ${{ secrets.SYNC_APP_ID != '' }}
    outputs:
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - name: GitHub App token (so the fix commit re-triggers the builds)
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      - name: Checkout the PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Checkout the synchronizer helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ohanalabs-ai/github-platform
          ref: ${{ job.workflow_sha || github.job_workflow_sha }}
          path: .pr-security-sync
          sparse-checkout: actions/docker
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-security-sync-collect
          path: ${{ env.OUT_DIR }}
      - name: Apply the deterministic fixes
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=mod
        run: python3 .pr-security-sync/actions/docker/pr-security-sync/sync.py patch
      - name: Commit + push (one commit)
        id: push
        env:
          LEVEL: ${{ inputs.accept-trivy-job-patches }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add -A -- . ':!.pr-security-sync' ':!pr-security-sync'
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name="pr-security-synchronizer[bot]" -c user.email="pr-security-synchronizer@users.noreply.github.com" \
            commit -q -m ":lock: deps: apply Trivy fixes at or above ${LEVEL} (pr-security-synchronizer)"
          git push -q origin "HEAD:${HEAD_REF}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [ "$HAS_APP" = true ] || echo "::warning::fix commit pushed with GITHUB_TOKEN — it will NOT re-trigger the builds; pass SYNC_APP_ID/SYNC_APP_PRIVATE_KEY or push an empty commit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-security-sync-patch
          path: ${{ env.OUT_DIR }}/patches.json
          retention-days: 30

  copa:
    name: 🧩 copa ${{ matrix.service }}
    needs: collect
    if: inputs.copa && needs.collect.outputs.has_copa == 'true'
    runs-on: ${{ inputs.github-actions-runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect.outputs.copa_matrix) }}
    steps:
      - name: Start BuildKit for Copa (digest-pinned)
        run: |
          docker run --detach --rm --privileged --name buildkitd -p 127.0.0.1:8888:8888 \
            moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea \
            --addr tcp://0.0.0.0:8888 >/dev/null
      - name: Checkout the synchronizer helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ohanalabs-ai/github-platform
          ref: ${{ job.workflow_sha || github.job_workflow_sha }}
          path: .pr-security-sync
          sparse-checkout: actions/docker
          persist-credentials: false
      - name: Install Trivy + Copa (checksum-pinned)
        env:
          INSTALL_COPA: "true"
        run: bash .pr-security-sync/actions/docker/image-security/install.sh
      - name: Registry login (ghcr.io, push the patched image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null
      - name: Copa patch + re-scan
        env:
          IMAGE: ${{ matrix.image }}
          SERVICE: ${{ matrix.service }}
          BUILDKIT_ADDR: tcp://127.0.0.1:8888
        run: bash .pr-security-sync/actions/docker/pr-security-sync/copa.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-security-sync-copa-${{ matrix.service }}
          path: ${{ env.OUT_DIR }}/copa
          retention-days: 30

  decide:
    name: ⚖️ decide
    needs: [collect, patch, copa]
    if: always() && needs.collect.result == 'success'
    runs-on: ${{ inputs.github-actions-runner }}
    outputs:
      status: ${{ steps.decide.outputs.status }}
      blocking: ${{ steps.decide.outputs.blocking }}
    steps:
      - name: Checkout the synchronizer helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ohanalabs-ai/github-platform
          ref: ${{ job.workflow_sha || github.job_workflow_sha }}
          path: .pr-security-sync
          sparse-checkout: actions/docker
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-security-sync-*
          path: ${{ env.OUT_DIR }}
          merge-multiple: true
      - name: Decide (fails on policy-fail)
        id: decide
        env:
          PATCH_COMMIT: ${{ needs.patch.outputs.commit }}
        run: python3 .pr-security-sync/actions/docker/pr-security-sync/sync.py decide
      - name: Sticky PR comment
        if: always() && inputs.add-pr-comment && github.event_name == 'pull_request' && steps.decide.outcome != 'skipped'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-security-synchronizer
          recreate: true
          path: ${{ env.OUT_DIR }}/pr-security-sync.md
