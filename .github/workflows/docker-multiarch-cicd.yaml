# Reusable workflow for the docker multi-architect CICD
on:
  workflow_call:
    inputs:
      github-actions-runner:
        description: Where to run
        required: false
        type: string
        default: ubuntu-latest
      github-job-timeout-minutes:
        description: Allow more minutes to run, using 10 as the default timeout. Increase if required
        type: number
        default: 10
        required: false
      registry:
        description: Default registry for all builds.
        required: false
        type: string
        default: ghcr.io
      platforms:
        description: Platforms used by docker buildx bake.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      docker-compose-context: 
        description: Where the compose file context is
        required: false
        type: string
        default: .
      docker-compose-file-name:
        description: Compose file used by docker buildx bake.
        required: false
        type: string
        default: docker-compose.yaml
      docker-compose-target-service:
        description: Bake target service name ... Not needed if docker-compose.yaml has a single service
        required: false
        type: string
      image-name-suffix:
        description: >-
          Optional path suffix appended to the image base for monorepos that
          publish MULTIPLE images from ONE repo (e.g. "api" ->
          ghcr.io/<owner>/<repo>/api). Empty (default) preserves the legacy
          one-image-per-repo name, so existing single-image callers are
          unaffected. On Docker Hub (tag builds) the suffix is joined with a
          dash (<owner>/<repo>-<suffix>) because Docker Hub allows only a single
          path segment.
        required: false
        type: string
        default: ""
      dockerhub-registry:
        description: Optional Docker Hub registry hostname for release mirroring.
        required: false
        type: string
        default: docker.io
      dockerhub-namespace:
        description: Optional Docker Hub namespace for release mirroring.
        required: false
        type: string
        default: ${{ github.repository_owner }}
      push-attestations:
        description: Enable/disable pushing attestations to the registry.
        required: false
        type: string
        default: "false"
      dockerhub-registry-username:
        description: Optional Docker Hub registry username to publish images.
        required: false
        type: string
      dockerhub-registry-token:
        description: Optional Docker Hub registry token to publish images.
        required: false
        type: string
      slsa-build-level:
        description: >-
          User-declared SLSA Build level for this pipeline. This value is
          reported as workflow policy and is not detected or certified by
          gh attestation verify.
        required: false
        type: string
        default: "2"
      slsa-signer-workflow:
        description: Reusable workflow identity used to verify artifact attestations with gh attestation verify.
        required: false
        type: string
        default: vionix-proj/github-platform/.github/workflows/docker-multiarch-cicd.yaml

# Set of permissions needed by the workflow
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  pull-requests: write

# Default registry for ALL builds
env:
  REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
  DOCKER_COMPOSE_FILE_NAME: ${{ inputs.docker-compose-file-name }}

  # Optional Docker Hub settings (only used on tag builds AND only if DOCKER_REGISTRY_TOKEN is set)
  DOCKERHUB_REGISTRY: ${{ inputs.dockerhub-registry || 'docker.io' }}
  DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub-namespace || github.repository_owner }}

  # Set to true only if your org/repo has artifact-metadata enabled and you want attestations pushed to the registry
  # The artifact-metadata APIs (used when pushing attestations to the registry) are only available if your org/account has the Artifact Attestations feature enabled. For personal orgs it’s generally not on by default, and there’s no self-serve toggle. If you don’t have it enabled, GitHub returns 404 and you’ll see the storage-record warning.
  # What to do: Keep PUSH_ATTESTATIONS: "false" (as in the current workflow). You’ll still build, push images, and generate SBOMs; you just won’t push attestations to GHCR.
  # If/when you get the feature enabled (GitHub Enterprise Cloud / allowlisted), set PUSH_ATTESTATIONS: "true" to start pushing attestations. No other changes needed.
  PUSH_ATTESTATIONS: ${{ inputs.push-attestations || 'false' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-build:
    name: 🏗️ pr-build 
    timeout-minutes: ${{ inputs.github-job-timeout-minutes }}
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ${{ inputs.github-actions-runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Loads docker compose properties
        id: compose-metadata
        uses: vionix-proj/actions/docker/compose/metadata@main
        with:
          compose-path: ${{ inputs.docker-compose-file-name }}
          target-service: ${{ inputs.docker-compose-target-service }}

      - name: Verify bake targets from compose file
        shell: bash
        run: |
          set -euo pipefail
          echo "Using compose file: ${{ env.DOCKER_COMPOSE_FILE_NAME }}"
          test -f "${{ env.DOCKER_COMPOSE_FILE_NAME }}" || (echo "::error::Compose file not found"; ls -la; exit 1)
          docker buildx version
          docker buildx bake -f "${{ env.DOCKER_COMPOSE_FILE_NAME }}" --print

      - name: Compute vars
        id: vars
        shell: bash
        run: |
          echo "pr=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "full_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          # Optional monorepo suffix: ghcr.io/<owner>/<repo>[/<suffix>]
          SUFFIX="$(echo '${{ inputs.image-name-suffix }}' | tr '[:upper:]' '[:lower:]' | sed 's#^/*##; s#/*$##')"
          BASE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SUFFIX" ]; then BASE="${BASE}/${SUFFIX}"; fi
          echo "ghcr_image_base=${BASE}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Force docker/bake-action to use ONLY GHCR by rewriting compose image references to ghcr.io/owner/repo
      - name: Rewrite compose images to GHCR only
        shell: bash
        working-directory: ${{ inputs.docker-compose-context }}
        env:
          GHCR_IMAGE_BASE: ${{ steps.vars.outputs.ghcr_image_base }}
          FILE: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
        run: |
          set -euo pipefail
          FILE="${{ env.DOCKER_COMPOSE_FILE_NAME }}"
          echo "Rewriting any 'image:' fields in $FILE to ${GHCR_IMAGE_BASE}"
          python - <<'PY'
          import os, re
          path = os.environ["FILE"] if "FILE" in os.environ else os.environ.get("DOCKER_COMPOSE_FILE_NAME","docker-compose.yaml")
          ghcr = os.environ["GHCR_IMAGE_BASE"]
          with open(path, "r", encoding="utf-8") as f:
            s = f.read()
          s2, n = re.subn(r'(?m)^(?P<indent>\s*)image:\s*.+$', r'\g<indent>image: ' + ghcr, s)
          if n == 0:
            print(f"::warning::No 'image:' fields found in {path}. If your compose file sets image elsewhere, Bake may still push to Docker Hub.")
          with open(path, "w", encoding="utf-8") as f:
            f.write(s2)
          print(f"Rewrote {n} image field(s) in {path}")
          PY

      - name: Docker metadata (PR) - labels only
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=PR build for #${{ steps.vars.outputs.pr }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          flavor: latest=false

      - name: Build (PR) -> push only PR+SHA tags (no latest)
        id: bake_pr
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          files: |
            ${{ env.DOCKER_COMPOSE_FILE_NAME }}
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: ${{ steps.compose-metadata.outputs.target-service }}
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          set: |
            ${{ steps.compose-metadata.outputs.target-service }}.platform=${{ env.PLATFORMS }}
            ${{ steps.compose-metadata.outputs.target-service }}.tags=${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}
            ${{ steps.compose-metadata.outputs.target-service }}.tags=${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.compose-metadata.outputs.target-service }}.cache-from=type=gha,scope=${{ steps.compose-metadata.outputs.target-service }}
            ${{ steps.compose-metadata.outputs.target-service }}.cache-to=type=gha,mode=max,scope=${{ steps.compose-metadata.outputs.target-service }}

      - name: Resolve image digest (PR)
        id: pr_digest
        shell: bash
        env:
          TARGET_SERVICE: ${{ steps.compose-metadata.outputs.target-service }}
          # Pass the bake metadata JSON through the environment (NOT inlined into the
          # shell body). The multi-arch provenance embeds Dockerfile RUN commands with
          # single quotes and $(...) which break a single-quoted bash string.
          META_JSON: ${{ steps.bake_pr.outputs.metadata }}
          IMAGE_BASE: ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}
        run: |
          set -euo pipefail
          DIGEST=$(printf '%s' "$META_JSON" | jq -r --arg t "$TARGET_SERVICE" '.[$t]["containerimage.digest"] // .["containerimage.digest"] // empty')
          if [ -z "$DIGEST" ]; then
            echo "::error::Digest not found in bake metadata"; exit 1
          fi
          echo "image_base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (PR)
        if: env.PUSH_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-name: ${{ steps.pr_digest.outputs.image_base }}
          subject-digest: ${{ steps.pr_digest.outputs.digest }}
          push-to-registry: ${{ env.PUSH_ATTESTATIONS }}
          show-summary: true

      - name: Generate SBOM (PR)
        if: env.PUSH_ATTESTATIONS == 'true'
        id: sbom_pr
        uses: anchore/sbom-action@v0.17.3
        with:
          image: ${{ steps.pr_digest.outputs.image_base }}@${{ steps.pr_digest.outputs.digest }}
          output-file: sbom-pr.spdx.json

      - name: Attest SBOM (PR)
        if: env.PUSH_ATTESTATIONS == 'true'
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1.4.1
        with:
          subject-name: ${{ steps.pr_digest.outputs.image_base }}
          subject-digest: ${{ steps.pr_digest.outputs.digest }}
          sbom-path: sbom-pr.spdx.json
          push-to-registry: ${{ env.PUSH_ATTESTATIONS }}
          show-summary: true

      - name: Summarize build metadata (PR)
        shell: bash
        run: |
          {
            echo "### Docker image metadata (PR #${{ steps.vars.outputs.pr }})";
            echo "";
            echo "- Image: ${{ steps.pr_digest.outputs.image_base }}";
            echo "- Digest: ${{ steps.pr_digest.outputs.digest }}";
            echo "";
            echo "Tags:";
            echo '```';
            echo "${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}";
            echo "${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}";
            echo '```';
            echo "Labels:";
            echo '```';
            echo "${{ steps.meta.outputs.labels }}";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with build metadata
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          IMAGE: ${{ steps.pr_digest.outputs.image_base }}
          DIGEST: ${{ steps.pr_digest.outputs.digest }}
          TAGS: |
            ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}
            ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}
          LABELS: ${{ steps.meta.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- docker-meta -->';
            const body = `${marker}
            ## Docker image metadata
            - Image: ${process.env.IMAGE}
            - Digest: ${process.env.DIGEST}
            <details><summary>Tags</summary>
            \`\`\`
            ${process.env.TAGS}
            \`\`\`
            </details>
            <details><summary>Labels</summary>
            \`\`\`
            ${process.env.LABELS}
            \`\`\`
            </details>
            `;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  pr-delete:
    name: 🗑️ pr-delete
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ${{ inputs.github-actions-runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Delete GHCR package for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PKG_NAME: ${{ github.event.repository.name }}/pr/${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          ENCODED=$(jq -rn --arg s "$PKG_NAME" '$s|@uri')

          if [ "$OWNER_TYPE" = "Organization" ]; then
            API_PATH="/orgs/${REPO_OWNER}/packages/container/${ENCODED}"
          else
            API_PATH="/users/${REPO_OWNER}/packages/container/${ENCODED}"
          fi

          API_URL="${GITHUB_API_URL}${API_PATH}"
          RESPONSE_BODY=$(mktemp)

          {
            echo "# 🗑️ Delete PR GitHub Container Registry package"
            echo "* Path: ${API_PATH}"
            echo "* Package name: ${PKG_NAME}"
            echo "* API: ${API_URL}"
            echo "* Run attempt: ${RUN_ATTEMPT}"
          } >> "$GITHUB_STEP_SUMMARY"

          HTTP_STATUS=$(
            curl --silent --show-error \
              --output "$RESPONSE_BODY" \
              --write-out "%{http_code}" \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL"
          )

          case "$HTTP_STATUS" in
            204)
              echo "✅ Deleted package '${PKG_NAME}'." >> "$GITHUB_STEP_SUMMARY"
              ;;

            404)
              WARNING="The PR #${PR_NUMBER} tags might have been removed before if this is a rerun of this job. Check the job history!"
              echo "::warning title=GHCR package not found::${WARNING}"
              echo "⚠️ ${WARNING}" >> "$GITHUB_STEP_SUMMARY"

              if [ "$RUN_ATTEMPT" -gt 1 ]; then
                echo "This is rerun attempt #${RUN_ATTEMPT}, so the package was probably deleted by an earlier attempt." \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;

            *)
              echo "::error title=Failed to delete GHCR package::GitHub API returned HTTP ${HTTP_STATUS}"
              cat "$RESPONSE_BODY"
              exit 1
              ;;
          esac

  ref-build:
    name: 🧱 ref-build
    timeout-minutes: ${{ inputs.github-job-timeout-minutes }}
    if: |
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ${{ inputs.github-actions-runner }}
    outputs:
      effective_ref: ${{ steps.build_vars.outputs.effective_ref }}
      effective_sha: ${{ steps.build_vars.outputs.effective_sha }}
      short_sha: ${{ steps.build_vars.outputs.short_sha }}
      image_base: ${{ steps.ref_build.outputs.image-base }}
      image_tag: ${{ steps.build_vars.outputs.image_tag }}
      image_description: ${{ steps.build_vars.outputs.image_description }}
      image_digest: ${{ steps.ref_build.outputs.digest }}
      image_subject: ${{ steps.ref_build.outputs.subject }}
      report_title: SLSA verification (merge/ref build)
      pr_number: ${{ steps.build_vars.outputs.pr_number }}
      comment_enabled: ${{ steps.build_vars.outputs.comment_enabled }}
    steps:
      - name: Checkout effective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}

      - name: Consolidate build vars
        id: build_vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EFFECTIVE_REF="${{ github.event.pull_request.base.ref }}"
            EFFECTIVE_SHA="${{ github.event.pull_request.merge_commit_sha || github.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            COMMENT_ENABLED="true"
            IMAGE_DESCRIPTION="Ref build for merged PR #${PR_NUMBER} to ${EFFECTIVE_REF}"
          else
            EFFECTIVE_REF="${GITHUB_REF_NAME}"
            EFFECTIVE_SHA="${GITHUB_SHA}"
            PR_NUMBER=""
            COMMENT_ENABLED="false"
            IMAGE_DESCRIPTION="Ref build for ${GITHUB_REF_TYPE} ${EFFECTIVE_REF}"
          fi

          SHORT_SHA="${EFFECTIVE_SHA::7}"
          # Optional monorepo suffix: ghcr.io/<owner>/<repo>[/<suffix>]
          SUFFIX="$(echo '${{ inputs.image-name-suffix }}' | tr '[:upper:]' '[:lower:]' | sed 's#^/*##; s#/*$##')"
          IMAGE_BASE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SUFFIX" ]; then IMAGE_BASE="${IMAGE_BASE}/${SUFFIX}"; fi
          # Docker tags allow only [A-Za-z0-9._-] (max 128 chars). Branch refs may contain
          # '/' (e.g. vionix/base-0.9.11), which is illegal in a tag, so slugify any invalid
          # character to '-' -> vionix-base-0.9.11. effective_ref (below) keeps the real ref.
          REF_SLUG="$(printf '%s' "${EFFECTIVE_REF}" | sed 's#[^A-Za-z0-9._-]#-#g')"
          IMAGE_TAG="${IMAGE_BASE}:${REF_SLUG}-${SHORT_SHA}"

          echo "effective_ref=${EFFECTIVE_REF}" >> "$GITHUB_OUTPUT"
          echo "effective_sha=${EFFECTIVE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_description=${IMAGE_DESCRIPTION}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "comment_enabled=${COMMENT_ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Summarize consolidated build vars
        shell: bash
        run: |
          {
            echo "### Consolidated ref build values";
            echo "";
            echo "- Effective ref: ${{ steps.build_vars.outputs.effective_ref }}";
            echo "- Effective sha: ${{ steps.build_vars.outputs.effective_sha }}";
            echo "- Short sha: ${{ steps.build_vars.outputs.short_sha }}";
            echo "- Image base: ${{ steps.build_vars.outputs.image_base }}";
            echo "- Image tag: ${{ steps.build_vars.outputs.image_tag }}";
            echo "- Description: ${{ steps.build_vars.outputs.image_description }}";
            echo "- PR number: ${{ steps.build_vars.outputs.pr_number || 'n/a' }}";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and attest by ref
        id: ref_build
        uses: vionix-proj/actions/docker/ref-build@main
        with:
          registry: ${{ env.REGISTRY }}
          platforms: ${{ env.PLATFORMS }}
          ref-sha: ${{ steps.build_vars.outputs.effective_sha }}
          docker-compose-context: ${{ inputs.docker-compose-context }}
          docker-compose-file-name: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
          target-service: ${{ inputs.docker-compose-target-service }}
          image-base: ${{ steps.build_vars.outputs.image_base }}
          image-description: ${{ steps.build_vars.outputs.image_description }}
          tags: |
            ${{ steps.build_vars.outputs.image_tag }}
          push-attestations: ${{ env.PUSH_ATTESTATIONS }}
          sbom-file: sbom-ref.spdx.json

      - name: Comment PR with build metadata
        if: ${{ steps.build_vars.outputs.comment_enabled == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          IMAGE: ${{ steps.ref_build.outputs.image-base }}
          DIGEST: ${{ steps.ref_build.outputs.digest }}
          TAGS: |
            ${{ steps.build_vars.outputs.image_tag }}
          PR_NUMBER: ${{ steps.build_vars.outputs.pr_number }}
          REF_NAME: ${{ steps.build_vars.outputs.effective_ref }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- docker-meta -->';
            const body = `${marker}
            ## Docker image metadata (merge)
            - Ref: ${process.env.REF_NAME}
            - Image: ${process.env.IMAGE}
            - Digest: ${process.env.DIGEST}
            <details><summary>Tags</summary>
            \`\`\`
            ${process.env.TAGS}
            \`\`\`
            </details>
            `;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  release-build:
    name: 🏷️ release
    timeout-minutes: ${{ inputs.github-job-timeout-minutes }}
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ${{ inputs.github-actions-runner }}
    outputs:
      effective_ref: ${{ steps.vars.outputs.tag }}
      effective_sha: ${{ steps.vars.outputs.sha }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_base: ${{ steps.release_ref_build.outputs.image-base }}
      image_digest: ${{ steps.release_ref_build.outputs.digest }}
      image_subject: ${{ steps.release_ref_build.outputs.subject }}
      report_title: SLSA verification (release build)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Compute vars
        id: vars
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          # Optional monorepo suffix. GHCR: .../<repo>/<suffix>. Docker Hub allows
          # only one path segment, so join with a dash: <owner>/<repo>-<suffix>.
          SUFFIX="$(echo '${{ inputs.image-name-suffix }}' | tr '[:upper:]' '[:lower:]' | sed 's#^/*##; s#/*$##')"
          BASE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          DH_REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SUFFIX" ]; then BASE="${BASE}/${SUFFIX}"; DH_REPO="${DH_REPO}-${SUFFIX//\//-}"; fi
          echo "ghcr_image_base=${BASE}" >> $GITHUB_OUTPUT
          echo "dockerhub_repo=${DH_REPO}" >> $GITHUB_OUTPUT

      - name: Build and attest for release tag
        id: release_ref_build
        uses: vionix-proj/actions/docker/ref-build@main
        with:
          registry: ${{ env.REGISTRY }}
          platforms: ${{ env.PLATFORMS }}
          ref-sha: ${{ steps.vars.outputs.sha }}
          docker-compose-context: ${{ inputs.docker-compose-context }}
          docker-compose-file-name: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
          target-service: ${{ inputs.docker-compose-target-service }}
          image-base: ${{ steps.vars.outputs.ghcr_image_base }}
          image-description: Release build for tag ${{ steps.vars.outputs.tag }}
          tags: |
            ${{ steps.vars.outputs.ghcr_image_base }}:${{ steps.vars.outputs.tag }}
          push-attestations: ${{ env.PUSH_ATTESTATIONS }}
          sbom-file: sbom-tag.spdx.json
          push-latest: true

      - name: Docker Hub creds (optional)
        id: dh_creds
        shell: bash
        env:
          DOCKER_REGISTRY_USERNAME: ${{ inputs.dockerhub-registry-username }}
          DOCKER_REGISTRY_TOKEN: ${{ inputs.dockerhub-registry-token }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_REGISTRY_USERNAME}" ] && [ -n "${DOCKER_REGISTRY_TOKEN}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub (optional)
        if: steps.dh_creds.outputs.enabled == 'true'
        env:
          DOCKER_REGISTRY_USERNAME: ${{ inputs.dockerhub-registry-username }}
          DOCKER_REGISTRY_TOKEN: ${{ inputs.dockerhub-registry-token }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_TOKEN }}

      - name: Publish to Docker Hub (optional, tag builds only)
        if: steps.dh_creds.outputs.enabled == 'true'
        shell: bash
        env:
          GHCR_IMAGE: ${{ steps.vars.outputs.ghcr_image_base }}
          DIGEST: ${{ steps.release_ref_build.outputs.digest }}
          DOCKERHUB_REPO: ${{ steps.vars.outputs.dockerhub_repo }}
          TAG: ${{ steps.vars.outputs.tag }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail
          SRC="${GHCR_IMAGE}@${DIGEST}"
          docker buildx imagetools create -t "docker.io/${DOCKERHUB_REPO}:${TAG}" -t "docker.io/${DOCKERHUB_REPO}:${TAG}-${SHORT_SHA}" "${SRC}"

  github-release:
    name: 📝 github-release
    needs:
      - release-build
    if: ${{ needs.release-build.result == 'success' }}
    runs-on: ${{ inputs.github-actions-runner }}
    timeout-minutes: 5

    permissions:
      contents: write

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_url: ${{ steps.release.outputs.release_url }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_draft: ${{ steps.release.outputs.release_draft }}
      release_prerelease: ${{ steps.release.outputs.release_prerelease }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Find or create draft GitHub release
        id: release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TAG_NAME: ${{ needs.release-build.outputs.effective_ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG_NAME;

            if (!tag) {
              core.setFailed(
                'The release-build job did not provide an effective_ref tag.'
              );
              return;
            }

            let release;
            let created = false;

            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag
              });

              release = response.data;

              core.info(
                `Found existing GitHub Release for tag ${tag}: ` +
                `${release.html_url}`
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const prerelease =
                /(?:^|[-.])(alpha|beta|rc|pre)(?:[-.\d]|$)/i.test(tag);

              core.info(
                `No GitHub Release exists for tag ${tag}; ` +
                'creating a draft release.'
              );

              const response = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                draft: true,
                prerelease,
                generate_release_notes: true
              });

              release = response.data;
              created = true;

              core.notice(
                `Created draft GitHub Release for ${tag}: ` +
                `${release.html_url}`
              );
            }

            core.setOutput('release_id', String(release.id));
            core.setOutput('release_url', release.html_url);
            core.setOutput('release_created', String(created));
            core.setOutput('release_draft', String(release.draft));
            core.setOutput(
              'release_prerelease',
              String(release.prerelease)
            );
            core.setOutput('tag_name', release.tag_name);

      - name: Summarize prepared release
        shell: bash
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_DRAFT: ${{ steps.release.outputs.release_draft }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.release_prerelease }}
        run: |
          set -euo pipefail

          {
            echo "## 📝 GitHub Release prepared"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Tag | \`${TAG_NAME}\` |"
            echo "| Release ID | \`${RELEASE_ID}\` |"
            echo "| Created by this run | \`${RELEASE_CREATED}\` |"
            echo "| Draft | \`${RELEASE_DRAFT}\` |"
            echo "| Prerelease | \`${RELEASE_PRERELEASE}\` |"
            echo "| Release | [View GitHub Release](${RELEASE_URL}) |"
          } >> "$GITHUB_STEP_SUMMARY"


  slsa-report:
    name: 🛡️ slsa
    needs:
      - ref-build
      - release-build
      - github-release

    # For a ref event, release-build and prepare-release are skipped.
    # For a tag event, ref-build is skipped.
    # always() prevents those expected skips from automatically skipping
    # this job.
    if: |
      always() &&
      (
        needs['ref-build'].result == 'success' ||
        (
          needs['release-build'].result == 'success' &&
          needs['github-release'].result == 'success'
        )
      )

    runs-on: ${{ inputs.github-actions-runner }}
    timeout-minutes: 5

    permissions:
      contents: write
      packages: read
      attestations: read
      artifact-metadata: read
      pull-requests: write

    steps:
      - name: Resolve SLSA report inputs
        id: report_vars
        shell: bash
        env:
          REF_RESULT: ${{ needs['ref-build'].result }}
          REF_SUBJECT: ${{ needs['ref-build'].outputs.image_subject }}
          REF_IMAGE_BASE: ${{ needs['ref-build'].outputs.image_base }}
          REF_DIGEST: ${{ needs['ref-build'].outputs.image_digest }}
          REF_NAME: ${{ needs['ref-build'].outputs.effective_ref }}
          REF_TITLE: ${{ needs['ref-build'].outputs.report_title }}
          RELEASE_RESULT: ${{ needs['release-build'].result }}
          RELEASE_SUBJECT: ${{ needs['release-build'].outputs.image_subject }}
          RELEASE_IMAGE_BASE: ${{ needs['release-build'].outputs.image_base }}
          RELEASE_DIGEST: ${{ needs['release-build'].outputs.image_digest }}
          RELEASE_REF_NAME: ${{ needs['release-build'].outputs.effective_ref }}
          RELEASE_TITLE: ${{ needs['release-build'].outputs.report_title }}
        run: |
          set -euo pipefail

          if [ "${RELEASE_RESULT}" = "success" ]; then
            SUBJECT="${RELEASE_SUBJECT}"
            IMAGE_BASE="${RELEASE_IMAGE_BASE}"
            DIGEST="${RELEASE_DIGEST}"
            REF_NAME="${RELEASE_REF_NAME}"
            TITLE="${RELEASE_TITLE}"
            BUILD_TYPE="release"
          elif [ "${REF_RESULT}" = "success" ]; then
            SUBJECT="${REF_SUBJECT}"
            IMAGE_BASE="${REF_IMAGE_BASE}"
            DIGEST="${REF_DIGEST}"
            REF_NAME="${REF_NAME}"
            TITLE="${REF_TITLE}"
            BUILD_TYPE="ref"
          else
            echo "::error::No successful build is available for SLSA verification."
            exit 1
          fi

          if [ -z "${SUBJECT}" ] ||
             [ -z "${IMAGE_BASE}" ] ||
             [ -z "${DIGEST}" ] ||
             [ -z "${REF_NAME}" ]; then
            echo "::error::The successful build did not provide all required SLSA inputs."
            echo "::error::Subject: ${SUBJECT:-<empty>}"
            echo "::error::Image base: ${IMAGE_BASE:-<empty>}"
            echo "::error::Digest: ${DIGEST:-<empty>}"
            echo "::error::Ref name: ${REF_NAME:-<empty>}"
            exit 1
          fi

          if [ -z "${TITLE}" ]; then
            if [ "${BUILD_TYPE}" = "release" ]; then
              TITLE="SLSA verification (release build)"
            else
              TITLE="SLSA verification (merge/ref build)"
            fi
          fi

          {
            echo "subject=${SUBJECT}"
            echo "image_base=${IMAGE_BASE}"
            echo "digest=${DIGEST}"
            echo "ref_name=${REF_NAME}"
            echo "title=${TITLE}"
            echo "build_type=${BUILD_TYPE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🛡️ SLSA report inputs"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Build type | \`${BUILD_TYPE}\` |"
            echo "| Ref | \`${REF_NAME}\` |"
            echo "| Image | \`${IMAGE_BASE}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Subject | \`${SUBJECT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify SLSA provenance
        id: report
        uses: vionix-proj/actions/docker/slsa-report@main
        with:
          subject: ${{ steps.report_vars.outputs.subject }}
          image-base: ${{ steps.report_vars.outputs.image_base }}
          digest: ${{ steps.report_vars.outputs.digest }}
          signer-workflow: ${{ inputs.slsa-signer-workflow }}
          slsa-build-level: ${{ inputs.slsa-build-level }}
          ref-name: ${{ steps.report_vars.outputs.ref_name }}
          title: ${{ steps.report_vars.outputs.title }}
          fail-on-unverified: "true"

      - name: Summarize verification result
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.report_vars.outputs.build_type }}
          REF_NAME: ${{ steps.report_vars.outputs.ref_name }}
          SUBJECT: ${{ steps.report_vars.outputs.subject }}
          VERIFIED: ${{ steps.report.outputs.verified }}
          DECLARED_SLSA_BUILD_LEVEL: ${{ steps.report.outputs.declared_slsa_build_level }}
          REPORT: ${{ steps.report.outputs.summary_markdown }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          WORKFLOW_RUN_URL="${REPOSITORY_URL}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo ""
            echo "## SLSA verification result"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Build type | \`${BUILD_TYPE}\` |"
            echo "| Ref | \`${REF_NAME}\` |"
            echo "| Verified | \`${VERIFIED}\` |"
            echo "| Subject | \`${SUBJECT}\` |"
            echo "| Workflow run | [View workflow run](${WORKFLOW_RUN_URL}) |"
            echo "| Declared SLSA Build level | \`${DECLARED_SLSA_BUILD_LEVEL}\` |"
            echo ""
            printf '%s\n' "${REPORT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment merged PR with SLSA report
        if: |
          steps.report_vars.outputs.build_type == 'ref' &&
          needs['ref-build'].outputs.comment_enabled == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          IMAGE: ${{ steps.report_vars.outputs.image_base }}
          DIGEST: ${{ steps.report_vars.outputs.digest }}
          SUBJECT: ${{ steps.report_vars.outputs.subject }}
          REF_NAME: ${{ steps.report_vars.outputs.ref_name }}
          PR_NUMBER: ${{ needs['ref-build'].outputs.pr_number }}
          IMAGE_TAG: ${{ needs['ref-build'].outputs.image_tag }}
          VERIFIED: ${{ steps.report.outputs.verified }}
          SLSA_REPORT: ${{ steps.report.outputs.summary_markdown }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- docker-meta -->';

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed(
                `Invalid pull request number: ${process.env.PR_NUMBER}`
              );
              return;
            }

            const repositoryUrl =
              `${context.serverUrl}/${owner}/${repo}`;
            const packageUrl =
              `${repositoryUrl}/pkgs/container/${encodeURIComponent(repo)}`;
            const workflowRunUrl =
              `${repositoryUrl}/actions/runs/${context.runId}`;

            const body = `${marker}
            ## Docker image metadata (merge)

            | Property | Value |
            |---|---|
            | Ref | \`${process.env.REF_NAME}\` |
            | Container package | [\`${process.env.IMAGE}\`](${packageUrl}) |
            | Digest | \`${process.env.DIGEST}\` |
            | Subject | \`${process.env.SUBJECT}\` |
            | SLSA verified | ${process.env.VERIFIED === 'true' ? '✅ Yes' : '❌ No'} |
            | Workflow run | [View verification run](${workflowRunUrl}) |

            <details>
            <summary>Tags</summary>

            \`\`\`text
            ${process.env.IMAGE_TAG}
            \`\`\`

            </details>

            ${process.env.SLSA_REPORT || ''}
            `;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              }
            );

            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });

              core.notice(
                `Updated SLSA report on pull request #${issueNumber}.`
              );
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });

              core.notice(
                `Added SLSA report to pull request #${issueNumber}.`
              );
            }

      - name: Add SLSA report and publish GitHub release
        if: |
          steps.report_vars.outputs.build_type == 'release' &&
          steps.report.outputs.verified == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RELEASE_ID: ${{ needs['github-release'].outputs.release_id }}
          RELEASE_URL: ${{ needs['github-release'].outputs.release_url }}
          TAG_NAME: ${{ steps.report_vars.outputs.ref_name }}
          IMAGE: ${{ steps.report_vars.outputs.image_base }}
          DIGEST: ${{ steps.report_vars.outputs.digest }}
          SUBJECT: ${{ steps.report_vars.outputs.subject }}
          VERIFIED: ${{ steps.report.outputs.verified }}
          SLSA_REPORT: ${{ steps.report.outputs.summary_markdown }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const tag = process.env.TAG_NAME;

            if (!Number.isInteger(releaseId) || releaseId <= 0) {
              core.setFailed(
                `Invalid GitHub Release ID: ${process.env.RELEASE_ID}`
              );
              return;
            }

            const repositoryUrl =
              `${context.serverUrl}/${owner}/${repo}`;
            const tagUrl =
              `${repositoryUrl}/releases/tag/${encodeURIComponent(tag)}`;
            const packageUrl =
              `${repositoryUrl}/pkgs/container/${encodeURIComponent(repo)}`;
            const workflowRunUrl =
              `${repositoryUrl}/actions/runs/${context.runId}`;

            const markerStart = '<!-- slsa-report:start -->';
            const markerEnd = '<!-- slsa-report:end -->';

            const response = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId
            });

            const release = response.data;

            if (release.tag_name !== tag) {
              core.setFailed(
                `Prepared release tag ${release.tag_name} does not match ` +
                `the verified tag ${tag}.`
              );
              return;
            }

            const slsaSection = `${markerStart}
            ## 🛡️ SLSA verification

            | Property | Value |
            |---|---|
            | Status | ✅ Verified |
            | Tag | [\`${tag}\`](${tagUrl}) |
            | Container package | [\`${process.env.IMAGE}\`](${packageUrl}) |
            | Digest | \`${process.env.DIGEST}\` |
            | Subject | \`${process.env.SUBJECT}\` |
            | Workflow run | [View verification run](${workflowRunUrl}) |

            ${process.env.SLSA_REPORT || ''}

            ${markerEnd}`;

            const escapeRegex = value =>
              value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const existingSection = new RegExp(
              `${escapeRegex(markerStart)}[\\s\\S]*?${escapeRegex(markerEnd)}`,
              'm'
            );

            const currentBody = release.body || '';

            const body = existingSection.test(currentBody)
              ? currentBody.replace(existingSection, slsaSection)
              : `${currentBody.trimEnd()}

            ${slsaSection}`.trim();

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              body,
              draft: false
            });

            core.notice(
              `Published verified release ${tag}: ` +
              `${process.env.RELEASE_URL || tagUrl}`
            );
