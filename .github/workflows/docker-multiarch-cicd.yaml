# Reusable workflow for the docker multi-architect CICD
#
# Build provenance (see the attestation-mode input + ATTEST_MODE env below):
#   * PUBLIC caller repos  -> GitHub Artifact Attestations (actions/attest-build-provenance,
#     pushed to the registry; consumers verify with `gh attestation verify`).
#   * PRIVATE caller repos with `vault-url` + `transit-key` -> `vault` (the default for them,
#     INTEGRATE-29): our OWN key signs. The ref/release build job (never a pull_request run)
#     logs into Vault with its GitHub OIDC token (hashicorp/vault-action, JWT role bound to
#     repository + ref — the role carries ci-image-signer-<org>), then cosign signs
#     (`cosign sign --recursive`) and attests (`--type slsaprovenance1` + `spdxjson`) the DIGEST
#     with `--key hashivault://<org>-ci-images`, NO transparency log. The provenance is built by
#     actions/docker/vault-sign/provenance.ts from the OIDC claims: builder.id = the claim
#     `job_workflow_ref` (THIS reusable @ the ref the caller pinned), externalParameters.workflow
#     = {repository, ref, path} of the caller — the shape the clusters' ClusterImagePolicy CUE
#     asserts (planeo-infra clusters/base/hooks/policy). The build job verifies the round trip
#     with the exported public key; the 🛡️ slsa job re-verifies with no Vault access at all.
#     Vault is tailnet-only for planeodev/ohanalabs-ai: set join-tailscale + pass the
#     TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET secrets explicitly.
#   * PRIVATE caller repos without Vault inputs -> `none` (❕ not attested, informational).
#   * `cosign` (keyless Sigstore, Fulcio + the PUBLIC Rekor log) is an EXPLICIT opt-in only:
#     it publishes the private repository's name, workflow and digests to the public
#     transparency log. Consumers verify with `cosign verify --certificate-identity-regexp
#     '^https://github.com/<signer-workflow>@' --certificate-oidc-issuer
#     https://token.actions.githubusercontent.com`.
#     Why not GitHub attestations for private repos: they exist only on GitHub Enterprise
#     Cloud — there is NO org-level toggle; a private repo just gets HTTP 404 from the
#     attestations API (ohanalabs-ai/vault-mcp-server run 35250882375), while the same pipeline
#     passes on a public repo (marcellodesales/mcp-brasil run 35491108003). The 🛡️ slsa job
#     verifies whichever mechanism applied and never 404s by design.
on:
  workflow_call:
    inputs:
      github-actions-runner:
        description: Where to run
        required: false
        type: string
        default: ubuntu-latest
      github-job-timeout-minutes:
        description: Allow more minutes to run, using 10 as the default timeout. Increase if required
        type: number
        default: 10
        required: false
      registry:
        description: Default registry for all builds.
        required: false
        type: string
        default: ghcr.io
      platforms:
        description: Platforms used by docker buildx bake.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      docker-compose-context: 
        description: Where the compose file context is
        required: false
        type: string
        default: .
      docker-compose-file-name:
        description: Compose file used by docker buildx bake.
        required: false
        type: string
        default: docker-compose.yaml
      docker-compose-target-service:
        description: Bake target service name ... Not needed if docker-compose.yaml has a single service
        required: false
        type: string
      image-name-suffix:
        description: >-
          Optional path suffix appended to the image base for monorepos that
          publish MULTIPLE images from ONE repo (e.g. "api" ->
          ghcr.io/<owner>/<repo>/api). Empty (default) preserves the legacy
          one-image-per-repo name, so existing single-image callers are
          unaffected. On Docker Hub (tag builds) the suffix is joined with a
          dash (<owner>/<repo>-<suffix>) because Docker Hub allows only a single
          path segment.
        required: false
        type: string
        default: ""
      dockerhub-registry:
        description: Optional Docker Hub registry hostname for release mirroring.
        required: false
        type: string
        default: docker.io
      dockerhub-namespace:
        description: Optional Docker Hub namespace for release mirroring.
        required: false
        type: string
        default: ${{ github.repository_owner }}
      push-attestations:
        description: >-
          Force GitHub-native attestations (actions/attest-build-provenance +
          push to the registry). Only works where GitHub Artifact Attestations
          are available (public repos; private repos need GitHub Enterprise
          Cloud). Prefer attestation-mode; this input is kept as an override.
        required: false
        type: string
        default: "false"
      attestation-mode:
        description: >-
          How the image digest gets verifiable build provenance.
          auto (default): public repo -> GitHub attestations (gh attestation verify);
          private repo with vault-url + transit-key -> vault; private repo without them -> none
          (GitHub Artifact Attestations for private repos require GitHub Enterprise Cloud).
          github: force GitHub attestations.
          vault: sign + attest with our Vault Transit key (cosign hashivault://, no Rekor) in the
          ref/release build job only — never on pull_request events, only on vault-signing-refs.
          cosign: EXPLICIT opt-in to Sigstore keyless — writes the repo/workflow/digest to the
          PUBLIC Rekor transparency log; never the default.
          none: skip provenance (the slsa job reports "not attested" and does not fail).
        required: false
        type: string
        default: auto
      vault-url:
        description: >-
          Vault address for attestation-mode vault (e.g. https://vault.platform.planeo.dev —
          tailnet-only: also set join-tailscale). Empty = no Vault signing.
        required: false
        type: string
        default: ""
      vault-auth-path:
        description: Mount path of Vault's JWT auth method bound to GitHub's OIDC issuer.
        required: false
        type: string
        default: github-jwt
      vault-role:
        description: >-
          Vault JWT role the build job logs in as — bound to repository + ref and carrying the
          ci-image-signer-<org> policy, e.g. gha-<repo>-<branch> (callers pass a format() of github.ref_name). A ref without a
          role is simply not in vault-signing-refs.
        required: false
        type: string
        default: ""
      vault-jwt-audience:
        description: "`aud` of the GitHub OIDC token — must be in the role's bound_audiences."
        required: false
        type: string
        default: https://github.com/${{ github.repository_owner }}
      vault-ca-cert:
        description: Optional base64-encoded PEM CA bundle when Vault's TLS is a private CA (empty = public CAs).
        required: false
        type: string
        default: ""
      transit-key:
        description: Vault Transit signing key, one per org (planeodev-ci-images, ohanalabs-ai-ci-images).
        required: false
        type: string
        default: ""
      transit-path:
        description: Vault Transit mount path.
        required: false
        type: string
        default: transit
      vault-signing-refs:
        description: >-
          Refs whose build signs (comma/newline; exact, or a trailing-* prefix such as refs/tags/v*).
          Default = the refs the admission CUE accepts and the per-repo Vault roles are bound to.
          pull_request events never sign, whatever this says.
        required: false
        type: string
        default: refs/heads/main,refs/heads/develop
      join-tailscale:
        description: >-
          Join the runner to the tailnet before the Vault login (vault mode only) — Vault is
          reachable only through the Tailscale subnet router. Needs the TS_OAUTH_* secrets.
        required: false
        type: boolean
        default: false
      tailscale-tags:
        description: ACL tags of the ephemeral CI node.
        required: false
        type: string
        default: tag:ci
      tailscale-args:
        description: Extra `tailscale up` flags.
        required: false
        type: string
        default: --accept-routes
      dockerhub-registry-username:
        description: Optional Docker Hub registry username to publish images.
        required: false
        type: string
      dockerhub-registry-token:
        description: Optional Docker Hub registry token to publish images.
        required: false
        type: string
      slsa-build-level:
        description: >-
          User-declared SLSA Build level for this pipeline. This value is
          reported as workflow policy and is not detected or certified by
          gh attestation verify.
        required: false
        type: string
        default: "2"
      slsa-signer-workflow:
        description: Reusable workflow identity used to verify artifact attestations with gh attestation verify.
        required: false
        type: string
        default: ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml

    secrets:
      TS_OAUTH_CLIENT_ID:
        description: >-
          Tailscale OAuth client (tags in tailscale-tags) — only read when join-tailscale is true.
          Pass explicitly (`secrets: { TS_OAUTH_CLIENT_ID: … }`): `secrets: inherit` does not deliver
          a caller org's selected-repository secrets to a workflow hosted in another org.
        required: false
      TS_OAUTH_SECRET:
        required: false

    outputs:
      image_tag:
        description: Full image reference produced by ref-build (e.g. ghcr.io/org/repo/suffix:main-abc1234). Empty when ref-build was skipped.
        value: ${{ jobs.ref-build.outputs.image_tag }}
      image_base:
        description: Image base without tag (e.g. ghcr.io/org/repo/suffix). Empty when ref-build was skipped.
        value: ${{ jobs.ref-build.outputs.image_base }}
      short_sha:
        description: 7-character SHA used in the tag. Empty when ref-build was skipped.
        value: ${{ jobs.ref-build.outputs.short_sha }}
      effective_ref:
        description: Git ref name (branch or tag) used for the build. Empty when ref-build was skipped.
        value: ${{ jobs.ref-build.outputs.effective_ref }}
      image_ref:
        description: >-
          Digest-pinned reference (<image-base>@sha256:…) of the image THIS run built — the PR build
          (<base>/pr/<N>@…), the branch/ref build, or the tag release build, whichever ran. Empty when
          nothing was built (e.g. a closed PR). Use it to compose a job that `needs` the build, such
          as an image scan: `needs: <build-job>` and pass `needs.<build-job>.outputs.image_ref`.
        value: ${{ jobs.pr-build.outputs.image_ref || jobs.ref-build.outputs.image_ref || jobs.release-build.outputs.image_ref }}
      image_digest:
        description: Digest (sha256:…) of the image this run built (PR, ref or release build). Empty when nothing was built.
        value: ${{ jobs.pr-build.outputs.image_digest || jobs.ref-build.outputs.image_digest || jobs.release-build.outputs.image_digest }}
      signed:
        description: >-
          "true" when this run signed + attested the digest with the Vault Transit key (attestation-mode
          vault) and verified the round trip; "false" otherwise (PR runs, non-signing refs, other modes).
        value: ${{ jobs.ref-build.outputs.vault_signed == 'true' && 'true' || (jobs.release-build.outputs.vault_signed == 'true' && 'true' || 'false') }}
      signature_key_ref:
        description: The key the digest was signed with (hashivault://<transit-key>); empty when not signed.
        value: ${{ jobs.ref-build.outputs.vault_key_ref || jobs.release-build.outputs.vault_key_ref }}

# Set of permissions needed by the workflow
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  pull-requests: write

# Default registry for ALL builds
env:
  REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
  DOCKER_COMPOSE_FILE_NAME: ${{ inputs.docker-compose-file-name }}

  # Optional Docker Hub settings (only used on tag builds AND only if DOCKER_REGISTRY_TOKEN is set)
  DOCKERHUB_REGISTRY: ${{ inputs.dockerhub-registry || 'docker.io' }}
  DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub-namespace || github.repository_owner }}

  # Provenance mechanism, resolved once for every job (see the attestation-mode input).
  #   github -> actions/attest-build-provenance (+ SBOM) pushed to the registry, verified with
  #             `gh attestation verify`. Needs GitHub Artifact Attestations: public repos have
  #             it; PRIVATE repos only get it on GitHub Enterprise Cloud (no org toggle exists —
  #             a private repo simply gets HTTP 404 from the attestations API).
  #   vault  -> our Vault Transit key: cosign sign + attest (slsaprovenance1, spdxjson) with
  #             --key hashivault://<transit-key>, no Rekor, in the ref/release build job only
  #             (actions/docker/vault-sign). Chosen automatically for private repos that pass
  #             vault-url + transit-key.
  #   cosign -> Sigstore keyless (Fulcio + PUBLIC Rekor). Explicit opt-in only — it publishes the
  #             private repo's identity to the public transparency log.
  #   none   -> no provenance; the 🛡️ slsa job reports it and does not fail. The auto default for
  #             a private repo without Vault inputs.
  # push-attestations "true" is the legacy override that forces `github` regardless of visibility.
  ATTEST_MODE: ${{ inputs.attestation-mode != '' && inputs.attestation-mode != 'auto' && inputs.attestation-mode || (inputs.push-attestations == 'true' && 'github') || (github.event.repository.visibility != 'private' && 'github') || (inputs.vault-url != '' && inputs.transit-key != '' && 'vault') || 'none' }}
  # Derived: GitHub-native attestations are produced (and pushed) only in github mode (= ATTEST_MODE == 'github').
  PUSH_ATTESTATIONS: ${{ (inputs.attestation-mode == 'github' || ((inputs.attestation-mode == '' || inputs.attestation-mode == 'auto') && (inputs.push-attestations == 'true' || github.event.repository.visibility != 'private'))) && 'true' || 'false' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-build:
    name: 🏗️ pr-build 
    timeout-minutes: ${{ inputs.github-job-timeout-minutes }}
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ${{ inputs.github-actions-runner }}
    # Exposed so a caller can compose a job that `needs` this build (e.g. an image scan) on PRs too.
    outputs:
      image_base: ${{ steps.pr_digest.outputs.image_base }}
      image_digest: ${{ steps.pr_digest.outputs.digest }}
      image_ref: ${{ steps.pr_digest.outputs.digest && format('{0}@{1}', steps.pr_digest.outputs.image_base, steps.pr_digest.outputs.digest) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Sanitize compose file for build (strip env_file, seed empty .env)
        id: sanitize_compose_env_file
        shell: bash
        env:
          FILE: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
        run: |
          set -euo pipefail
          FILE="${{ env.DOCKER_COMPOSE_FILE_NAME }}"
          echo "Sanitizing $FILE before build: env_file only affects 'docker compose up' runtime, not image builds, and CI never has a real .env checked out."

          python3 -c "import yaml" 2>/dev/null || pip install --quiet --user pyyaml

          python3 - <<'PY'
          import os
          import sys

          path = os.environ.get("FILE", os.environ.get("DOCKER_COMPOSE_FILE_NAME", "docker-compose.yaml"))

          try:
              import yaml
          except ImportError:
              print("::error::python3 'yaml' module (PyYAML) is required but not available on this runner.")
              sys.exit(1)

          with open(path, "r", encoding="utf-8") as f:
              compose = yaml.safe_load(f) or {}

          services = compose.get("services") or {}
          affected = sorted(
              name for name, cfg in services.items()
              if isinstance(cfg, dict) and "env_file" in cfg
          )

          if affected:
              for name in affected:
                  del services[name]["env_file"]
              with open(path, "w", encoding="utf-8") as f:
                  yaml.safe_dump(compose, f, sort_keys=False)
              names = ", ".join(affected)
              print(
                  f"::warning::Removed 'env_file' from service(s) [{names}] in {path} before build. "
                  "env_file references a local .env that doesn't exist in CI; it only affects "
                  "'docker compose up' runtime, not image builds, so it is stripped before docker "
                  "buildx bake/build reads this compose file."
              )
          else:
              print(f"No 'env_file' entries found in {path}; nothing to strip.")
          PY

          # Defensive safety net regardless of whether env_file was found above: some part
          # of the build pipeline (or a future compose feature) may still implicitly stat
          # a .env file. Always ensure an empty one exists so nothing breaks on it being
          # missing. This is intentionally unconditional and idempotent.
          : > .env
          echo "Ensured an empty .env exists at $(pwd)/.env as a build-time safety net."

      - name: Loads docker compose properties
        id: compose-metadata
        uses: ohanalabs-ai/actions/docker/compose/metadata@main
        with:
          compose-path: ${{ inputs.docker-compose-file-name }}
          target-service: ${{ inputs.docker-compose-target-service }}

      - name: Verify bake targets from compose file
        shell: bash
        run: |
          set -euo pipefail
          echo "Using compose file: ${{ env.DOCKER_COMPOSE_FILE_NAME }}"
          test -f "${{ env.DOCKER_COMPOSE_FILE_NAME }}" || (echo "::error::Compose file not found"; ls -la; exit 1)
          docker buildx version
          docker buildx bake -f "${{ env.DOCKER_COMPOSE_FILE_NAME }}" --print

      - name: Compute vars
        id: vars
        shell: bash
        run: |
          echo "pr=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "full_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          # Optional monorepo suffix: ghcr.io/<owner>/<repo>[/<suffix>]
          SUFFIX="$(echo '${{ inputs.image-name-suffix }}' | tr '[:upper:]' '[:lower:]' | sed 's#^/*##; s#/*$##')"
          BASE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SUFFIX" ]; then BASE="${BASE}/${SUFFIX}"; fi
          echo "ghcr_image_base=${BASE}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Force docker/bake-action to use ONLY GHCR by rewriting compose image references to ghcr.io/owner/repo
      - name: Rewrite compose images to GHCR only
        shell: bash
        env:
          GHCR_IMAGE_BASE: ${{ steps.vars.outputs.ghcr_image_base }}
          FILE: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
        run: |
          set -euo pipefail
          FILE="${{ env.DOCKER_COMPOSE_FILE_NAME }}"
          echo "Rewriting any 'image:' fields in $FILE to ${GHCR_IMAGE_BASE}"
          python - <<'PY'
          import os, re
          path = os.environ["FILE"] if "FILE" in os.environ else os.environ.get("DOCKER_COMPOSE_FILE_NAME","docker-compose.yaml")
          ghcr = os.environ["GHCR_IMAGE_BASE"]
          with open(path, "r", encoding="utf-8") as f:
            s = f.read()
          s2, n = re.subn(r'(?m)^(?P<indent>\s*)image:\s*.+$', r'\g<indent>image: ' + ghcr, s)
          if n == 0:
            print(f"::warning::No 'image:' fields found in {path}. If your compose file sets image elsewhere, Bake may still push to Docker Hub.")
          with open(path, "w", encoding="utf-8") as f:
            f.write(s2)
          print(f"Rewrote {n} image field(s) in {path}")
          PY

      - name: Docker metadata (PR) - labels only
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=PR build for #${{ steps.vars.outputs.pr }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          flavor: latest=false

      - name: Build (PR) -> push only PR+SHA tags (no latest)
        id: bake_pr
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          files: |
            ${{ env.DOCKER_COMPOSE_FILE_NAME }}
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: ${{ steps.compose-metadata.outputs.target-service }}
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          set: |
            ${{ steps.compose-metadata.outputs.target-service }}.platform=${{ env.PLATFORMS }}
            ${{ steps.compose-metadata.outputs.target-service }}.context=${{ inputs.docker-compose-context }}
            ${{ steps.compose-metadata.outputs.target-service }}.tags=${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}
            ${{ steps.compose-metadata.outputs.target-service }}.tags=${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.compose-metadata.outputs.target-service }}.cache-from=type=gha,scope=${{ steps.compose-metadata.outputs.target-service }}
            ${{ steps.compose-metadata.outputs.target-service }}.cache-to=type=gha,mode=max,scope=${{ steps.compose-metadata.outputs.target-service }}

      - name: Resolve image digest (PR)
        id: pr_digest
        shell: bash
        env:
          TARGET_SERVICE: ${{ steps.compose-metadata.outputs.target-service }}
          # Pass the bake metadata JSON through the environment (NOT inlined into the
          # shell body). The multi-arch provenance embeds Dockerfile RUN commands with
          # single quotes and $(...) which break a single-quoted bash string.
          META_JSON: ${{ steps.bake_pr.outputs.metadata }}
          IMAGE_BASE: ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}
        run: |
          set -euo pipefail
          DIGEST=$(printf '%s' "$META_JSON" | jq -r --arg t "$TARGET_SERVICE" '.[$t]["containerimage.digest"] // .["containerimage.digest"] // empty')
          if [ -z "$DIGEST" ]; then
            echo "::error::Digest not found in bake metadata"; exit 1
          fi
          echo "image_base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (PR)
        if: env.PUSH_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-name: ${{ steps.pr_digest.outputs.image_base }}
          subject-digest: ${{ steps.pr_digest.outputs.digest }}
          push-to-registry: ${{ env.PUSH_ATTESTATIONS }}
          show-summary: true

      - name: Generate SBOM (PR)
        if: env.PUSH_ATTESTATIONS == 'true'
        id: sbom_pr
        uses: anchore/sbom-action@v0.17.3
        with:
          image: ${{ steps.pr_digest.outputs.image_base }}@${{ steps.pr_digest.outputs.digest }}
          output-file: sbom-pr.spdx.json

      - name: Attest SBOM (PR)
        if: env.PUSH_ATTESTATIONS == 'true'
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1.4.1
        with:
          subject-name: ${{ steps.pr_digest.outputs.image_base }}
          subject-digest: ${{ steps.pr_digest.outputs.digest }}
          sbom-path: sbom-pr.spdx.json
          push-to-registry: ${{ env.PUSH_ATTESTATIONS }}
          show-summary: true

      - name: Install cosign (explicit keyless opt-in → public Sigstore)
        if: env.ATTEST_MODE == 'cosign'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate SBOM for cosign attestation
        if: env.ATTEST_MODE == 'cosign'
        uses: anchore/sbom-action@v0.17.3
        with:
          image: ${{ steps.pr_digest.outputs.image_base }}@${{ steps.pr_digest.outputs.digest }}
          output-file: sbom-pr-cosign.spdx.json
          upload-artifact: false

      - name: Sign + attest SLSA provenance with cosign (keyless — writes to the PUBLIC Rekor log)
        if: env.ATTEST_MODE == 'cosign'
        shell: bash
        env:
          SUBJECT: ${{ steps.pr_digest.outputs.image_base }}@${{ steps.pr_digest.outputs.digest }}
          SBOM_FILE: sbom-pr-cosign.spdx.json
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # SLSA v1 provenance predicate: builder = this reusable workflow's OIDC identity
          # (job_workflow_ref), source = the caller repo at the built commit.
          jq -n \
            --arg buildType "https://github.com/ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml" \
            --arg repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" --arg sha "${GITHUB_SHA}" \
            --arg workflowRef "${GITHUB_WORKFLOW_REF}" \
            --arg builderId "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --arg invocation "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{buildDefinition:{buildType:$buildType,externalParameters:{repository:$repo,ref:$ref,workflow:$workflowRef},internalParameters:{event:env.GITHUB_EVENT_NAME,runId:env.GITHUB_RUN_ID,runAttempt:env.GITHUB_RUN_ATTEMPT},resolvedDependencies:[{uri:("git+"+$repo+"@"+$ref),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:$builderId},metadata:{invocationId:$invocation,startedOn:$started}}}' \
            > "${RUNNER_TEMP}/slsa-provenance.json"
          cosign sign --recursive "${SUBJECT}"
          cosign attest --recursive --type slsaprovenance1 --predicate "${RUNNER_TEMP}/slsa-provenance.json" "${SUBJECT}"
          cosign attest --recursive --type spdxjson --predicate "${SBOM_FILE}" "${SUBJECT}"
          {
            echo "### 🔏 cosign keyless provenance"
            echo ""
            echo "Signed + attested (slsaprovenance1, spdxjson) \`${SUBJECT}\` with the OIDC identity of \`${GITHUB_WORKFLOW_REF}\` (Sigstore public good: Fulcio + Rekor)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize build metadata (PR)
        shell: bash
        run: |
          {
            echo "### Docker image metadata (PR #${{ steps.vars.outputs.pr }})";
            echo "";
            echo "- Image: ${{ steps.pr_digest.outputs.image_base }}";
            echo "- Digest: ${{ steps.pr_digest.outputs.digest }}";
            echo "";
            echo "Tags:";
            echo '```';
            echo "${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}";
            echo "${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}";
            echo '```';
            echo "Labels:";
            echo '```';
            echo "${{ steps.meta.outputs.labels }}";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with build metadata
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          IMAGE: ${{ steps.pr_digest.outputs.image_base }}
          DIGEST: ${{ steps.pr_digest.outputs.digest }}
          TAGS: |
            ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}
            ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}
          LABELS: ${{ steps.meta.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          IMAGE_SUFFIX: ${{ inputs.image-name-suffix }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const suffix = process.env.IMAGE_SUFFIX;
            const marker = `<!-- docker-meta${suffix ? ': ' + suffix : ''} -->`;
            const image = process.env.IMAGE;
            const shortSha = process.env.SHORT_SHA;
            const [, org, pkgPath] = image.match(/ghcr\.io\/([^/]+)\/(.+)/) || [];
            const encoded = pkgPath ? pkgPath.split('/').map(encodeURIComponent).join('%2F') : '';
            const packageUrl = org ? `https://github.com/orgs/${org}/packages/container/package/${encoded}` : image;
            const body = [
              marker,
              `## Docker image metadata — \`${image}:${shortSha}\``,
              '',
              '| Property | Value |',
              '|---|---|',
              `| Image | [${image}](${packageUrl}) |`,
              `| Digest | \`${process.env.DIGEST}\` |`,
              '',
              '**Tags**',
              '```',
              process.env.TAGS.trim(),
              '```',
              '**Labels**',
              '```',
              process.env.LABELS.trim(),
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  pr-delete:
    name: 🗑️ pr-delete
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ${{ inputs.github-actions-runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Delete GHCR package for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PKG_NAME: ${{ github.event.repository.name }}/pr/${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          ENCODED=$(jq -rn --arg s "$PKG_NAME" '$s|@uri')

          if [ "$OWNER_TYPE" = "Organization" ]; then
            API_PATH="/orgs/${REPO_OWNER}/packages/container/${ENCODED}"
          else
            API_PATH="/users/${REPO_OWNER}/packages/container/${ENCODED}"
          fi

          API_URL="${GITHUB_API_URL}${API_PATH}"
          RESPONSE_BODY=$(mktemp)

          {
            echo "# 🗑️ Delete PR GitHub Container Registry package"
            echo "* Path: ${API_PATH}"
            echo "* Package name: ${PKG_NAME}"
            echo "* API: ${API_URL}"
            echo "* Run attempt: ${RUN_ATTEMPT}"
          } >> "$GITHUB_STEP_SUMMARY"

          HTTP_STATUS=$(
            curl --silent --show-error \
              --output "$RESPONSE_BODY" \
              --write-out "%{http_code}" \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL"
          )

          case "$HTTP_STATUS" in
            204)
              echo "✅ Deleted package '${PKG_NAME}'." >> "$GITHUB_STEP_SUMMARY"
              ;;

            404)
              WARNING="The PR #${PR_NUMBER} tags might have been removed before if this is a rerun of this job. Check the job history!"
              echo "::warning title=GHCR package not found::${WARNING}"
              echo "⚠️ ${WARNING}" >> "$GITHUB_STEP_SUMMARY"

              if [ "$RUN_ATTEMPT" -gt 1 ]; then
                echo "This is rerun attempt #${RUN_ATTEMPT}, so the package was probably deleted by an earlier attempt." \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;

            *)
              echo "::error title=Failed to delete GHCR package::GitHub API returned HTTP ${HTTP_STATUS}"
              cat "$RESPONSE_BODY"
              exit 1
              ;;
          esac

  ref-build:
    name: 🧱 ref-build
    timeout-minutes: ${{ inputs.github-job-timeout-minutes }}
    if: |
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.github-actions-runner }}
    outputs:
      effective_ref: ${{ steps.build_vars.outputs.effective_ref }}
      effective_sha: ${{ steps.build_vars.outputs.effective_sha }}
      short_sha: ${{ steps.build_vars.outputs.short_sha }}
      image_base: ${{ steps.ref_build.outputs.image-base }}
      image_tag: ${{ steps.build_vars.outputs.image_tag }}
      image_description: ${{ steps.build_vars.outputs.image_description }}
      image_digest: ${{ steps.ref_build.outputs.digest }}
      image_ref: ${{ steps.ref_build.outputs.digest && format('{0}@{1}', steps.ref_build.outputs.image-base, steps.ref_build.outputs.digest) || '' }}
      image_subject: ${{ steps.ref_build.outputs.subject }}
      report_title: SLSA verification (merge/ref build)
      pr_number: ${{ steps.build_vars.outputs.pr_number }}
      comment_enabled: ${{ steps.build_vars.outputs.comment_enabled }}
      image_suffix: ${{ steps.build_vars.outputs.image_suffix }}
      vault_signed: ${{ steps.vault_sign.outputs.signed }}
      vault_reason: ${{ steps.vault_sign.outputs.reason }}
      vault_key_ref: ${{ steps.vault_sign.outputs.key-ref }}
      vault_public_key_b64: ${{ steps.vault_sign.outputs.public-key-b64 }}
    steps:
      - name: Checkout effective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}

      - name: Sanitize compose file for build (strip env_file, seed empty .env)
        id: sanitize_compose_env_file
        shell: bash
        env:
          FILE: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
        run: |
          set -euo pipefail
          FILE="${{ env.DOCKER_COMPOSE_FILE_NAME }}"
          echo "Sanitizing $FILE before build: env_file only affects 'docker compose up' runtime, not image builds, and CI never has a real .env checked out."

          python3 -c "import yaml" 2>/dev/null || pip install --quiet --user pyyaml

          python3 - <<'PY'
          import os
          import sys

          path = os.environ.get("FILE", os.environ.get("DOCKER_COMPOSE_FILE_NAME", "docker-compose.yaml"))

          try:
              import yaml
          except ImportError:
              print("::error::python3 'yaml' module (PyYAML) is required but not available on this runner.")
              sys.exit(1)

          with open(path, "r", encoding="utf-8") as f:
              compose = yaml.safe_load(f) or {}

          services = compose.get("services") or {}
          affected = sorted(
              name for name, cfg in services.items()
              if isinstance(cfg, dict) and "env_file" in cfg
          )

          if affected:
              for name in affected:
                  del services[name]["env_file"]
              with open(path, "w", encoding="utf-8") as f:
                  yaml.safe_dump(compose, f, sort_keys=False)
              names = ", ".join(affected)
              print(
                  f"::warning::Removed 'env_file' from service(s) [{names}] in {path} before build. "
                  "env_file references a local .env that doesn't exist in CI; it only affects "
                  "'docker compose up' runtime, not image builds, so it is stripped before docker "
                  "buildx bake/build reads this compose file."
              )
          else:
              print(f"No 'env_file' entries found in {path}; nothing to strip.")
          PY

          # Defensive safety net regardless of whether env_file was found above: some part
          # of the build pipeline (or a future compose feature) may still implicitly stat
          # a .env file. Always ensure an empty one exists so nothing breaks on it being
          # missing. This is intentionally unconditional and idempotent.
          : > .env
          echo "Ensured an empty .env exists at $(pwd)/.env as a build-time safety net."

      - name: Consolidate build vars
        id: build_vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EFFECTIVE_REF="${{ github.event.pull_request.base.ref }}"
            EFFECTIVE_SHA="${{ github.event.pull_request.merge_commit_sha || github.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            COMMENT_ENABLED="true"
            IMAGE_DESCRIPTION="Ref build for merged PR #${PR_NUMBER} to ${EFFECTIVE_REF}"
          else
            EFFECTIVE_REF="${GITHUB_REF_NAME}"
            EFFECTIVE_SHA="${GITHUB_SHA}"
            PR_NUMBER=""
            COMMENT_ENABLED="false"
            IMAGE_DESCRIPTION="Ref build for ${GITHUB_REF_TYPE} ${EFFECTIVE_REF}"
          fi

          SHORT_SHA="${EFFECTIVE_SHA::7}"
          # Optional monorepo suffix: ghcr.io/<owner>/<repo>[/<suffix>]
          SUFFIX="$(echo '${{ inputs.image-name-suffix }}' | tr '[:upper:]' '[:lower:]' | sed 's#^/*##; s#/*$##')"
          IMAGE_BASE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SUFFIX" ]; then IMAGE_BASE="${IMAGE_BASE}/${SUFFIX}"; fi
          # Docker tags allow only [A-Za-z0-9._-] (max 128 chars). Branch refs may contain
          # '/' (e.g. vionix/base-0.9.11), which is illegal in a tag, so slugify any invalid
          # character to '-' -> vionix-base-0.9.11. effective_ref (below) keeps the real ref.
          REF_SLUG="$(printf '%s' "${EFFECTIVE_REF}" | sed 's#[^A-Za-z0-9._-]#-#g')"
          IMAGE_TAG="${IMAGE_BASE}:${REF_SLUG}-${SHORT_SHA}"

          echo "effective_ref=${EFFECTIVE_REF}" >> "$GITHUB_OUTPUT"
          echo "effective_sha=${EFFECTIVE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_description=${IMAGE_DESCRIPTION}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "comment_enabled=${COMMENT_ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Summarize consolidated build vars
        shell: bash
        run: |
          {
            echo "### Consolidated ref build values";
            echo "";
            echo "- Effective ref: ${{ steps.build_vars.outputs.effective_ref }}";
            echo "- Effective sha: ${{ steps.build_vars.outputs.effective_sha }}";
            echo "- Short sha: ${{ steps.build_vars.outputs.short_sha }}";
            echo "- Image base: ${{ steps.build_vars.outputs.image_base }}";
            echo "- Image tag: ${{ steps.build_vars.outputs.image_tag }}";
            echo "- Description: ${{ steps.build_vars.outputs.image_description }}";
            echo "- PR number: ${{ steps.build_vars.outputs.pr_number || 'n/a' }}";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and attest by ref
        id: ref_build
        uses: ohanalabs-ai/actions/docker/ref-build@main
        with:
          registry: ${{ env.REGISTRY }}
          platforms: ${{ env.PLATFORMS }}
          ref-sha: ${{ steps.build_vars.outputs.effective_sha }}
          docker-compose-context: ${{ inputs.docker-compose-context }}
          docker-compose-file-name: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
          target-service: ${{ inputs.docker-compose-target-service }}
          image-base: ${{ steps.build_vars.outputs.image_base }}
          image-description: ${{ steps.build_vars.outputs.image_description }}
          tags: |
            ${{ steps.build_vars.outputs.image_tag }}
          push-attestations: ${{ env.PUSH_ATTESTATIONS }}
          sbom-file: sbom-ref.spdx.json

      # ── attestation-mode vault: our Transit key signs (actions/docker/vault-sign) ──────────────
      - name: Checkout this reusable's helpers (at the reusable's own commit)
        if: env.ATTEST_MODE == 'vault'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ohanalabs-ai/github-platform
          ref: ${{ job.workflow_sha || github.job_workflow_sha }}
          path: .vault-sign
          sparse-checkout: actions/docker/vault-sign
          persist-credentials: false

      - name: 🔏 Sign + attest with the org's Vault Transit key (no Rekor)
        id: vault_sign
        # Never a pull_request run: plan.ts refuses too, and the Vault role binds ref.
        if: env.ATTEST_MODE == 'vault' && github.event_name != 'pull_request'
        uses: ./.vault-sign/actions/docker/vault-sign
        with:
          subject: ${{ steps.ref_build.outputs.image-base }}@${{ steps.ref_build.outputs.digest }}
          vault-url: ${{ inputs.vault-url }}
          vault-auth-path: ${{ inputs.vault-auth-path }}
          vault-role: ${{ inputs.vault-role }}
          vault-jwt-audience: ${{ inputs.vault-jwt-audience }}
          vault-ca-cert: ${{ inputs.vault-ca-cert }}
          transit-key: ${{ inputs.transit-key }}
          transit-path: ${{ inputs.transit-path }}
          signing-refs: ${{ inputs.vault-signing-refs }}
          signer-workflow: ${{ inputs.slsa-signer-workflow }}
          join-tailscale: ${{ inputs.join-tailscale }}
          tailscale-tags: ${{ inputs.tailscale-tags }}
          tailscale-args: ${{ inputs.tailscale-args }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Install cosign (explicit keyless opt-in → public Sigstore)
        if: env.ATTEST_MODE == 'cosign'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate SBOM for cosign attestation
        if: env.ATTEST_MODE == 'cosign'
        uses: anchore/sbom-action@v0.17.3
        with:
          image: ${{ steps.ref_build.outputs.image-base }}@${{ steps.ref_build.outputs.digest }}
          output-file: sbom-ref-cosign.spdx.json
          upload-artifact: false

      - name: Sign + attest SLSA provenance with cosign (keyless — writes to the PUBLIC Rekor log)
        if: env.ATTEST_MODE == 'cosign'
        shell: bash
        env:
          SUBJECT: ${{ steps.ref_build.outputs.subject }}
          SBOM_FILE: sbom-ref-cosign.spdx.json
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # SLSA v1 provenance predicate: builder = this reusable workflow's OIDC identity
          # (job_workflow_ref), source = the caller repo at the built commit.
          jq -n \
            --arg buildType "https://github.com/ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml" \
            --arg repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" --arg sha "${GITHUB_SHA}" \
            --arg workflowRef "${GITHUB_WORKFLOW_REF}" \
            --arg builderId "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --arg invocation "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{buildDefinition:{buildType:$buildType,externalParameters:{repository:$repo,ref:$ref,workflow:$workflowRef},internalParameters:{event:env.GITHUB_EVENT_NAME,runId:env.GITHUB_RUN_ID,runAttempt:env.GITHUB_RUN_ATTEMPT},resolvedDependencies:[{uri:("git+"+$repo+"@"+$ref),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:$builderId},metadata:{invocationId:$invocation,startedOn:$started}}}' \
            > "${RUNNER_TEMP}/slsa-provenance.json"
          cosign sign --recursive "${SUBJECT}"
          cosign attest --recursive --type slsaprovenance1 --predicate "${RUNNER_TEMP}/slsa-provenance.json" "${SUBJECT}"
          cosign attest --recursive --type spdxjson --predicate "${SBOM_FILE}" "${SUBJECT}"
          {
            echo "### 🔏 cosign keyless provenance"
            echo ""
            echo "Signed + attested (slsaprovenance1, spdxjson) \`${SUBJECT}\` with the OIDC identity of \`${GITHUB_WORKFLOW_REF}\` (Sigstore public good: Fulcio + Rekor)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with build metadata
        if: ${{ steps.build_vars.outputs.comment_enabled == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          IMAGE: ${{ steps.ref_build.outputs.image-base }}
          DIGEST: ${{ steps.ref_build.outputs.digest }}
          TAGS: |
            ${{ steps.build_vars.outputs.image_tag }}
          PR_NUMBER: ${{ steps.build_vars.outputs.pr_number }}
          REF_NAME: ${{ steps.build_vars.outputs.effective_ref }}
          IMAGE_SUFFIX: ${{ steps.build_vars.outputs.image_suffix }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const suffix = process.env.IMAGE_SUFFIX;
            const marker = `<!-- docker-meta${suffix ? ': ' + suffix : ''} -->`;
            const image = process.env.IMAGE;
            const imageTag = process.env.TAGS.trim().split('\n')[0].trim();
            const [, org, pkgPath] = image.match(/ghcr\.io\/([^/]+)\/(.+)/) || [];
            const encoded = pkgPath ? pkgPath.split('/').map(encodeURIComponent).join('%2F') : '';
            const packageUrl = org ? `https://github.com/orgs/${org}/packages/container/package/${encoded}` : image;
            const body = [
              marker,
              `## Docker image metadata — \`${imageTag}\``,
              '',
              '| Property | Value |',
              '|---|---|',
              `| Ref | \`${process.env.REF_NAME}\` |`,
              `| Image | [${image}](${packageUrl}) |`,
              `| Digest | \`${process.env.DIGEST}\` |`,
              '',
              '**Tags**',
              '```',
              process.env.TAGS.trim(),
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  release-build:
    name: 🏷️ release
    timeout-minutes: ${{ inputs.github-job-timeout-minutes }}
    if: github.event_name == 'push' && github.ref_type == 'tag'
