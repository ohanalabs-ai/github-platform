# Reusable workflow for the docker multi-architect CICD
on:
  workflow_call:
    inputs:
      github-actions-runner:
        description: Where to run
        required: false
        type: string
        default: ubuntu-latest
      registry:
        description: Default registry for all builds.
        required: false
        type: string
        default: ghcr.io
      platforms:
        description: Platforms used by docker buildx bake.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      docker-compose-context: 
        description: Where the compose file context is
        required: false
        type: string
        default: .
      docker-compose-file-name:
        description: Compose file used by docker buildx bake.
        required: false
        type: string
        default: docker-compose.yaml
      docker-compose-target-service:
        description: Bake target service name ... Not needed if docker-compose.yaml has a single service
        required: false
        type: string
      dockerhub-registry:
        description: Optional Docker Hub registry hostname for release mirroring.
        required: false
        type: string
        default: docker.io
      dockerhub-namespace:
        description: Optional Docker Hub namespace for release mirroring.
        required: false
        type: string
        default: ${{ github.repository_owner }}
      push-attestations:
        description: Enable/disable pushing attestations to the registry.
        required: false
        type: string
        default: "false"
      dockerhub-registry-username:
        description: Optional Docker Hub registry username to publish images.
        required: false
        type: string
      dockerhub-registry-token:
        description: Optional Docker Hub registry token to publish images.
        required: false
        type: string
      slsa-signer-workflow:
        description: Reusable workflow identity used to verify artifact attestations with gh attestation verify.
        required: false
        type: string
        default: vionix-proj/github-platform/.github/workflows/docker-multiarch-cicd.yaml@main

# Set of permissions needed by the workflow
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  pull-requests: write

# Default registry for ALL builds
env:
  REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
  DOCKER_COMPOSE_FILE_NAME: ${{ inputs.docker-compose-file-name }}

  # Optional Docker Hub settings (only used on tag builds AND only if DOCKER_REGISTRY_TOKEN is set)
  DOCKERHUB_REGISTRY: ${{ inputs.dockerhub-registry || 'docker.io' }}
  DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub-namespace || github.repository_owner }}

  # Set to true only if your org/repo has artifact-metadata enabled and you want attestations pushed to the registry
  # The artifact-metadata APIs (used when pushing attestations to the registry) are only available if your org/account has the Artifact Attestations feature enabled. For personal orgs it’s generally not on by default, and there’s no self-serve toggle. If you don’t have it enabled, GitHub returns 404 and you’ll see the storage-record warning.
  # What to do: Keep PUSH_ATTESTATIONS: "false" (as in the current workflow). You’ll still build, push images, and generate SBOMs; you just won’t push attestations to GHCR.
  # If/when you get the feature enabled (GitHub Enterprise Cloud / allowlisted), set PUSH_ATTESTATIONS: "true" to start pushing attestations. No other changes needed.
  PUSH_ATTESTATIONS: ${{ inputs.push-attestations || 'false' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-build:
    name: 🏗️ pr-build 
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ${{ inputs.github-actions-runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Loads docker compose properties
        id: compose-metadata
        uses: vionix-proj/actions/docker/compose/metadata@main
        with:
          compose-path: ${{ inputs.docker-compose-file-name }}
          target-service: ${{ inputs.docker-compose-target-service }}

      - name: Verify bake targets from compose file
        shell: bash
        run: |
          set -euo pipefail
          echo "Using compose file: ${{ env.DOCKER_COMPOSE_FILE_NAME }}"
          test -f "${{ env.DOCKER_COMPOSE_FILE_NAME }}" || (echo "::error::Compose file not found"; ls -la; exit 1)
          docker buildx version
          docker buildx bake -f "${{ env.DOCKER_COMPOSE_FILE_NAME }}" --print

      - name: Compute vars
        id: vars
        shell: bash
        run: |
          echo "pr=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "full_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "ghcr_image_base=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Force docker/bake-action to use ONLY GHCR by rewriting compose image references to ghcr.io/owner/repo
      - name: Rewrite compose images to GHCR only
        shell: bash
        working-directory: ${{ inputs.docker-compose-context }}
        env:
          GHCR_IMAGE_BASE: ${{ steps.vars.outputs.ghcr_image_base }}
          FILE: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
        run: |
          set -euo pipefail
          FILE="${{ env.DOCKER_COMPOSE_FILE_NAME }}"
          echo "Rewriting any 'image:' fields in $FILE to ${GHCR_IMAGE_BASE}"
          python - <<'PY'
          import os, re
          path = os.environ["FILE"] if "FILE" in os.environ else os.environ.get("DOCKER_COMPOSE_FILE_NAME","docker-compose.yaml")
          ghcr = os.environ["GHCR_IMAGE_BASE"]
          with open(path, "r", encoding="utf-8") as f:
            s = f.read()
          s2, n = re.subn(r'(?m)^(?P<indent>\s*)image:\s*.+$', r'\g<indent>image: ' + ghcr, s)
          if n == 0:
            print(f"::warning::No 'image:' fields found in {path}. If your compose file sets image elsewhere, Bake may still push to Docker Hub.")
          with open(path, "w", encoding="utf-8") as f:
            f.write(s2)
          print(f"Rewrote {n} image field(s) in {path}")
          PY

      - name: Docker metadata (PR) - labels only
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=PR build for #${{ steps.vars.outputs.pr }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          flavor: latest=false

      - name: Build (PR) -> push only PR+SHA tags (no latest)
        id: bake_pr
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          files: |
            ${{ env.DOCKER_COMPOSE_FILE_NAME }}
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: ${{ steps.compose-metadata.outputs.target-service }}
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          set: |
            ${{ steps.compose-metadata.outputs.target-service }}.platform=${{ env.PLATFORMS }}
            ${{ steps.compose-metadata.outputs.target-service }}.tags=${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}
            ${{ steps.compose-metadata.outputs.target-service }}.tags=${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.compose-metadata.outputs.target-service }}.cache-from=type=gha,scope=${{ steps.compose-metadata.outputs.target-service }}
            ${{ steps.compose-metadata.outputs.target-service }}.cache-to=type=gha,mode=max,scope=${{ steps.compose-metadata.outputs.target-service }}

      - name: Resolve image digest (PR)
        id: pr_digest
        shell: bash
        env:
          TARGET_SERVICE: ${{ steps.compose-metadata.outputs.target-service }}
          # Pass the bake metadata JSON through the environment (NOT inlined into the
          # shell body). The multi-arch provenance embeds Dockerfile RUN commands with
          # single quotes and $(...) which break a single-quoted bash string.
          META_JSON: ${{ steps.bake_pr.outputs.metadata }}
          IMAGE_BASE: ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}
        run: |
          set -euo pipefail
          DIGEST=$(printf '%s' "$META_JSON" | jq -r --arg t "$TARGET_SERVICE" '.[$t]["containerimage.digest"] // .["containerimage.digest"] // empty')
          if [ -z "$DIGEST" ]; then
            echo "::error::Digest not found in bake metadata"; exit 1
          fi
          echo "image_base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (PR)
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-name: ${{ steps.pr_digest.outputs.image_base }}
          subject-digest: ${{ steps.pr_digest.outputs.digest }}
          push-to-registry: ${{ env.PUSH_ATTESTATIONS }}
          show-summary: true

      - name: Generate SBOM (PR)
        id: sbom_pr
        uses: anchore/sbom-action@v0.17.3
        with:
          image: ${{ steps.pr_digest.outputs.image_base }}@${{ steps.pr_digest.outputs.digest }}
          output-file: sbom-pr.spdx.json

      - name: Attest SBOM (PR)
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1.4.1
        with:
          subject-name: ${{ steps.pr_digest.outputs.image_base }}
          subject-digest: ${{ steps.pr_digest.outputs.digest }}
          sbom-path: sbom-pr.spdx.json
          push-to-registry: ${{ env.PUSH_ATTESTATIONS }}
          show-summary: true

      - name: Summarize build metadata (PR)
        shell: bash
        run: |
          {
            echo "### Docker image metadata (PR #${{ steps.vars.outputs.pr }})";
            echo "";
            echo "- Image: ${{ steps.pr_digest.outputs.image_base }}";
            echo "- Digest: ${{ steps.pr_digest.outputs.digest }}";
            echo "";
            echo "Tags:";
            echo '```';
            echo "${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}";
            echo "${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}";
            echo '```';
            echo "Labels:";
            echo '```';
            echo "${{ steps.meta.outputs.labels }}";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with build metadata
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          IMAGE: ${{ steps.pr_digest.outputs.image_base }}
          DIGEST: ${{ steps.pr_digest.outputs.digest }}
          TAGS: |
            ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.full_sha }}
            ${{ steps.vars.outputs.ghcr_image_base }}/pr/${{ steps.vars.outputs.pr }}:${{ steps.vars.outputs.short_sha }}
          LABELS: ${{ steps.meta.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- docker-meta -->';
            const body = `${marker}
            ## Docker image metadata
            - Image: ${process.env.IMAGE}
            - Digest: ${process.env.DIGEST}
            <details><summary>Tags</summary>
            \`\`\`
            ${process.env.TAGS}
            \`\`\`
            </details>
            <details><summary>Labels</summary>
            \`\`\`
            ${process.env.LABELS}
            \`\`\`
            </details>
            `;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  pr-delete:
    name: 🗑️ pr-delete
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ${{ inputs.github-actions-runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Delete GHCR package for this PR
        id: delete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PKG_NAME: ${{ github.event.repository.name }}/pr/${{ github.event.pull_request.number }}
        shell: bash
        run: |
          ENCODED=$(jq -rn --arg s "$PKG_NAME" '$s|@uri')
          if [ "$OWNER_TYPE" = "Organization" ]; then
            PATH="/orgs/${REPO_OWNER}/packages/container/${ENCODED}"
          else
            PATH="/users/${REPO_OWNER}/packages/container/${ENCODED}"
          fi

          echo "# 🗑️ Delete PR  Github Container Registry packages" >> $GITHUB_STEP_SUMMARY
          echo "* Path: ${PATH}" >> $GITHUB_STEP_SUMMARY
          echo "* Package Name: ${PKG_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "* API: ${GITHUB_API_URL}${PATH}" >> $GITHUB_STEP_SUMMARY

          echo "path=${PATH}" >> $GITHUB_OUTPUT

          #curl -sSfL -X DELETE -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" "${GITHUB_API_URL}${PATH}"

      - uses: octokit/request-action@v2.x
        id: get_latest_release
        with:
          route: DELETE ${{ steps.delete.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ref-build:
    name: 🧱 ref-build
    timeout-minutes: 10
    if: |
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ${{ inputs.github-actions-runner }}
    outputs:
      effective_ref: ${{ steps.build_vars.outputs.effective_ref }}
      effective_sha: ${{ steps.build_vars.outputs.effective_sha }}
      short_sha: ${{ steps.build_vars.outputs.short_sha }}
      image_base: ${{ steps.build_vars.outputs.image_base }}
      image_tag: ${{ steps.build_vars.outputs.image_tag }}
      image_description: ${{ steps.build_vars.outputs.image_description }}
      pr_number: ${{ steps.build_vars.outputs.pr_number }}
      comment_enabled: ${{ steps.build_vars.outputs.comment_enabled }}
    steps:
      - name: Checkout effective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}

      - name: Consolidate build vars
        id: build_vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EFFECTIVE_REF="${{ github.event.pull_request.base.ref }}"
            EFFECTIVE_SHA="${{ github.event.pull_request.merge_commit_sha || github.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            COMMENT_ENABLED="true"
            IMAGE_DESCRIPTION="Ref build for merged PR #${PR_NUMBER} to ${EFFECTIVE_REF}"
          else
            EFFECTIVE_REF="${GITHUB_REF_NAME}"
            EFFECTIVE_SHA="${GITHUB_SHA}"
            PR_NUMBER=""
            COMMENT_ENABLED="false"
            IMAGE_DESCRIPTION="Ref build for ${GITHUB_REF_TYPE} ${EFFECTIVE_REF}"
          fi

          SHORT_SHA="${EFFECTIVE_SHA::7}"
          IMAGE_BASE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${IMAGE_BASE}:${EFFECTIVE_REF}-${SHORT_SHA}"

          echo "effective_ref=${EFFECTIVE_REF}" >> "$GITHUB_OUTPUT"
          echo "effective_sha=${EFFECTIVE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_description=${IMAGE_DESCRIPTION}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "comment_enabled=${COMMENT_ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Summarize consolidated build vars
        shell: bash
        run: |
          {
            echo "### Consolidated ref build values";
            echo "";
            echo "- Effective ref: ${{ steps.build_vars.outputs.effective_ref }}";
            echo "- Effective sha: ${{ steps.build_vars.outputs.effective_sha }}";
            echo "- Short sha: ${{ steps.build_vars.outputs.short_sha }}";
            echo "- Image base: ${{ steps.build_vars.outputs.image_base }}";
            echo "- Image tag: ${{ steps.build_vars.outputs.image_tag }}";
            echo "- Description: ${{ steps.build_vars.outputs.image_description }}";
            echo "- PR number: ${{ steps.build_vars.outputs.pr_number || 'n/a' }}";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and attest by ref
        id: ref_build
        uses: vionix-proj/actions/docker/ref-build@main
        with:
          registry: ${{ env.REGISTRY }}
          platforms: ${{ env.PLATFORMS }}
          docker-compose-context: ${{ inputs.docker-compose-context }}
          docker-compose-file-name: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
          target-service: ${{ inputs.docker-compose-target-service }}
          image-base: ${{ steps.build_vars.outputs.image_base }}
          image-description: ${{ steps.build_vars.outputs.image_description }}
          tags: |
            ${{ steps.build_vars.outputs.image_tag }}
          push-attestations: ${{ env.PUSH_ATTESTATIONS }}
          sbom-file: sbom-ref.spdx.json

      - name: Verify SLSA provenance by ref
        id: slsa_ref
        uses: vionix-proj/actions/docker/slsa-report@main
        with:
          subject: ${{ steps.ref_build.outputs.subject }}
          image-base: ${{ steps.ref_build.outputs.image-base }}
          digest: ${{ steps.ref_build.outputs.digest }}
          signer-workflow: ${{ inputs.slsa-signer-workflow }}
          ref-name: ${{ steps.build_vars.outputs.effective_ref }}
          title: SLSA verification (merge/ref build)

      - name: Comment PR with build metadata
        if: ${{ steps.build_vars.outputs.comment_enabled == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          IMAGE: ${{ steps.ref_build.outputs.image-base }}
          DIGEST: ${{ steps.ref_build.outputs.digest }}
          TAGS: |
            ${{ steps.build_vars.outputs.image_tag }}
          PR_NUMBER: ${{ steps.build_vars.outputs.pr_number }}
          REF_NAME: ${{ steps.build_vars.outputs.effective_ref }}
          SLSA_REPORT: ${{ steps.slsa_ref.outputs.summary_markdown }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- docker-meta -->';
            const body = `${marker}
            ## Docker image metadata (merge)
            - Ref: ${process.env.REF_NAME}
            - Image: ${process.env.IMAGE}
            - Digest: ${process.env.DIGEST}
            <details><summary>Tags</summary>
            \`\`\`
            ${process.env.TAGS}
            \`\`\`
            </details>

            ${process.env.SLSA_REPORT}
            `;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  release-build:
    name: 🏷️ release
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ${{ inputs.github-actions-runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Compute vars
        id: vars
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "ghcr_image_base=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "dockerhub_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and attest for release tag
        id: release_ref_build
        uses: vionix-proj/actions/docker/ref-build@main
        with:
          registry: ${{ env.REGISTRY }}
          platforms: ${{ env.PLATFORMS }}
          docker-compose-context: ${{ inputs.docker-compose-context }}
          docker-compose-file-name: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
          target-service: ${{ inputs.docker-compose-target-service }}
          image-base: ${{ steps.vars.outputs.ghcr_image_base }}
          image-description: Release build for tag ${{ steps.vars.outputs.tag }}
          tags: |
            ${{ steps.vars.outputs.ghcr_image_base }}:${{ steps.vars.outputs.tag }}
          push-attestations: ${{ env.PUSH_ATTESTATIONS }}
          sbom-file: sbom-tag.spdx.json
          push-latest: true

      - name: Verify SLSA provenance for release
        id: slsa_release
        uses: vionix-proj/actions/docker/slsa-report@main
        with:
          subject: ${{ steps.release_ref_build.outputs.subject }}
          image-base: ${{ steps.release_ref_build.outputs.image-base }}
          digest: ${{ steps.release_ref_build.outputs.digest }}
          signer-workflow: ${{ inputs.slsa-signer-workflow }}
          ref-name: ${{ steps.vars.outputs.tag }}
          title: SLSA verification (release build)

      - name: Docker Hub creds (optional)
        id: dh_creds
        shell: bash
        env:
          DOCKER_REGISTRY_USERNAME: ${{ inputs.dockerhub-registry-username }}
          DOCKER_REGISTRY_TOKEN: ${{ inputs.dockerhub-registry-token }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_REGISTRY_USERNAME}" ] && [ -n "${DOCKER_REGISTRY_TOKEN}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub (optional)
        if: steps.dh_creds.outputs.enabled == 'true'
        env:
          DOCKER_REGISTRY_USERNAME: ${{ inputs.dockerhub-registry-username }}
          DOCKER_REGISTRY_TOKEN: ${{ inputs.dockerhub-registry-token }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_TOKEN }}

      - name: Publish to Docker Hub (optional, tag builds only)
        if: steps.dh_creds.outputs.enabled == 'true'
        shell: bash
        env:
          GHCR_IMAGE: ${{ steps.vars.outputs.ghcr_image_base }}
          DIGEST: ${{ steps.release_ref_build.outputs.digest }}
          DOCKERHUB_REPO: ${{ steps.vars.outputs.dockerhub_repo }}
          TAG: ${{ steps.vars.outputs.tag }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail
          SRC="${GHCR_IMAGE}@${DIGEST}"
