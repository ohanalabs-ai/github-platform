              names = ", ".join(affected)
              print(
                  f"::warning::Removed 'env_file' from service(s) [{names}] in {path} before build. "
                  "env_file references a local .env that doesn't exist in CI; it only affects "
                  "'docker compose up' runtime, not image builds, so it is stripped before docker "
                  "buildx bake/build reads this compose file."
              )
          else:
              print(f"No 'env_file' entries found in {path}; nothing to strip.")
          PY

          # Defensive safety net regardless of whether env_file was found above: some part
          # of the build pipeline (or a future compose feature) may still implicitly stat
          # a .env file. Always ensure an empty one exists so nothing breaks on it being
          # missing. This is intentionally unconditional and idempotent.
          : > .env
          echo "Ensured an empty .env exists at $(pwd)/.env as a build-time safety net."

      - name: Compute vars
        id: vars
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          # Optional monorepo suffix. GHCR: .../<repo>/<suffix>. Docker Hub allows
          # only one path segment, so join with a dash: <owner>/<repo>-<suffix>.
          SUFFIX="$(echo '${{ inputs.image-name-suffix }}' | tr '[:upper:]' '[:lower:]' | sed 's#^/*##; s#/*$##')"
          BASE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          DH_REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SUFFIX" ]; then BASE="${BASE}/${SUFFIX}"; DH_REPO="${DH_REPO}-${SUFFIX//\//-}"; fi
          echo "ghcr_image_base=${BASE}" >> $GITHUB_OUTPUT
          echo "dockerhub_repo=${DH_REPO}" >> $GITHUB_OUTPUT

      - name: Build and attest for release tag
        id: release_ref_build
        uses: ohanalabs-ai/actions/docker/ref-build@main
        with:
          registry: ${{ env.REGISTRY }}
          platforms: ${{ env.PLATFORMS }}
          ref-sha: ${{ steps.vars.outputs.sha }}
          docker-compose-context: ${{ inputs.docker-compose-context }}
          docker-compose-file-name: ${{ env.DOCKER_COMPOSE_FILE_NAME }}
          target-service: ${{ inputs.docker-compose-target-service }}
          image-base: ${{ steps.vars.outputs.ghcr_image_base }}
          image-description: Release build for tag ${{ steps.vars.outputs.tag }}
          tags: |
            ${{ steps.vars.outputs.ghcr_image_base }}:${{ steps.vars.outputs.tag }}
          push-attestations: ${{ env.PUSH_ATTESTATIONS }}
          sbom-file: sbom-tag.spdx.json
          push-latest: true

      # ── attestation-mode vault: our Transit key signs (actions/docker/vault-sign) ──────────────
      - name: Checkout this reusable's helpers (at the reusable's own commit)
        if: env.ATTEST_MODE == 'vault'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ohanalabs-ai/github-platform
          ref: ${{ job.workflow_sha || github.job_workflow_sha }}
          path: .vault-sign
          sparse-checkout: actions/docker/vault-sign
          persist-credentials: false

      - name: 🔏 Sign + attest with the org's Vault Transit key (no Rekor)
        id: vault_sign
        # Never a pull_request run: plan.ts refuses too, and the Vault role binds ref.
        if: env.ATTEST_MODE == 'vault' && github.event_name != 'pull_request'
        uses: ./.vault-sign/actions/docker/vault-sign
        with:
          subject: ${{ steps.release_ref_build.outputs.image-base }}@${{ steps.release_ref_build.outputs.digest }}
          vault-url: ${{ inputs.vault-url }}
          vault-auth-path: ${{ inputs.vault-auth-path }}
          vault-role: ${{ inputs.vault-role }}
          vault-jwt-audience: ${{ inputs.vault-jwt-audience }}
          vault-ca-cert: ${{ inputs.vault-ca-cert }}
          transit-key: ${{ inputs.transit-key }}
          transit-path: ${{ inputs.transit-path }}
          signing-refs: ${{ inputs.vault-signing-refs }}
          signer-workflow: ${{ inputs.slsa-signer-workflow }}
          join-tailscale: ${{ inputs.join-tailscale }}
          tailscale-tags: ${{ inputs.tailscale-tags }}
          tailscale-args: ${{ inputs.tailscale-args }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Install cosign (explicit keyless opt-in → public Sigstore)
        if: env.ATTEST_MODE == 'cosign'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate SBOM for cosign attestation
        if: env.ATTEST_MODE == 'cosign'
        uses: anchore/sbom-action@v0.17.3
        with:
          image: ${{ steps.release_ref_build.outputs.image-base }}@${{ steps.release_ref_build.outputs.digest }}
          output-file: sbom-tag-cosign.spdx.json
          upload-artifact: false

      - name: Sign + attest SLSA provenance with cosign (keyless — writes to the PUBLIC Rekor log)
        if: env.ATTEST_MODE == 'cosign'
        shell: bash
        env:
          SUBJECT: ${{ steps.release_ref_build.outputs.subject }}
          SBOM_FILE: sbom-tag-cosign.spdx.json
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # SLSA v1 provenance predicate: builder = this reusable workflow's OIDC identity
          # (job_workflow_ref), source = the caller repo at the built commit.
          jq -n \
            --arg buildType "https://github.com/ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml" \
            --arg repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" --arg sha "${GITHUB_SHA}" \
            --arg workflowRef "${GITHUB_WORKFLOW_REF}" \
            --arg builderId "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --arg invocation "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{buildDefinition:{buildType:$buildType,externalParameters:{repository:$repo,ref:$ref,workflow:$workflowRef},internalParameters:{event:env.GITHUB_EVENT_NAME,runId:env.GITHUB_RUN_ID,runAttempt:env.GITHUB_RUN_ATTEMPT},resolvedDependencies:[{uri:("git+"+$repo+"@"+$ref),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:$builderId},metadata:{invocationId:$invocation,startedOn:$started}}}' \
            > "${RUNNER_TEMP}/slsa-provenance.json"
          cosign sign --recursive "${SUBJECT}"
          cosign attest --recursive --type slsaprovenance1 --predicate "${RUNNER_TEMP}/slsa-provenance.json" "${SUBJECT}"
          cosign attest --recursive --type spdxjson --predicate "${SBOM_FILE}" "${SUBJECT}"
          {
            echo "### 🔏 cosign keyless provenance"
            echo ""
            echo "Signed + attested (slsaprovenance1, spdxjson) \`${SUBJECT}\` with the OIDC identity of \`${GITHUB_WORKFLOW_REF}\` (Sigstore public good: Fulcio + Rekor)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker Hub creds (optional)
        id: dh_creds
        shell: bash
        env:
          DOCKER_REGISTRY_USERNAME: ${{ inputs.dockerhub-registry-username }}
          DOCKER_REGISTRY_TOKEN: ${{ inputs.dockerhub-registry-token }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_REGISTRY_USERNAME}" ] && [ -n "${DOCKER_REGISTRY_TOKEN}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub (optional)
        if: steps.dh_creds.outputs.enabled == 'true'
        env:
          DOCKER_REGISTRY_USERNAME: ${{ inputs.dockerhub-registry-username }}
          DOCKER_REGISTRY_TOKEN: ${{ inputs.dockerhub-registry-token }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_TOKEN }}

      - name: Publish to Docker Hub (optional, tag builds only)
        if: steps.dh_creds.outputs.enabled == 'true'
        shell: bash
        env:
          GHCR_IMAGE: ${{ steps.vars.outputs.ghcr_image_base }}
          DIGEST: ${{ steps.release_ref_build.outputs.digest }}
          DOCKERHUB_REPO: ${{ steps.vars.outputs.dockerhub_repo }}
          TAG: ${{ steps.vars.outputs.tag }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail
          SRC="${GHCR_IMAGE}@${DIGEST}"
          docker buildx imagetools create -t "docker.io/${DOCKERHUB_REPO}:${TAG}" -t "docker.io/${DOCKERHUB_REPO}:${TAG}-${SHORT_SHA}" "${SRC}"

  github-release:
    name: 📝 github-release
    needs:
      - release-build
    if: ${{ needs.release-build.result == 'success' }}
    runs-on: ${{ inputs.github-actions-runner }}
    timeout-minutes: 5

    permissions:
      contents: write

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_url: ${{ steps.release.outputs.release_url }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_draft: ${{ steps.release.outputs.release_draft }}
      release_prerelease: ${{ steps.release.outputs.release_prerelease }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Find or create draft GitHub release
        id: release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TAG_NAME: ${{ needs.release-build.outputs.effective_ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG_NAME;

            if (!tag) {
              core.setFailed(
                'The release-build job did not provide an effective_ref tag.'
              );
              return;
            }

            let release;
            let created = false;

            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag
              });

              release = response.data;

              core.info(
                `Found existing GitHub Release for tag ${tag}: ` +
                `${release.html_url}`
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const prerelease =
                /(?:^|[-.])(alpha|beta|rc|pre)(?:[-.\/\d]|$)/i.test(tag);

              core.info(
                `No GitHub Release exists for tag ${tag}; ` +
                'creating a draft release.'
              );

              const response = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                draft: true,
                prerelease,
                generate_release_notes: true
              });

              release = response.data;
              created = true;

              core.notice(
                `Created draft GitHub Release for ${tag}: ` +
                `${release.html_url}`
              );
            }

            core.setOutput('release_id', String(release.id));
            core.setOutput('release_url', release.html_url);
            core.setOutput('release_created', String(created));
            core.setOutput('release_draft', String(release.draft));
            core.setOutput(
              'release_prerelease',
              String(release.prerelease)
            );
            core.setOutput('tag_name', release.tag_name);

      - name: Summarize prepared release
        shell: bash
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_DRAFT: ${{ steps.release.outputs.release_draft }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.release_prerelease }}
        run: |
          set -euo pipefail

          {
            echo "## 📝 GitHub Release prepared"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Tag | \`${TAG_NAME}\` |"
            echo "| Release ID | \`${RELEASE_ID}\` |"
            echo "| Created by this run | \`${RELEASE_CREATED}\` |"
            echo "| Draft | \`${RELEASE_DRAFT}\` |"
            echo "| Prerelease | \`${RELEASE_PRERELEASE}\` |"
            echo "| Release | [View GitHub Release](${RELEASE_URL}) |"
          } >> "$GITHUB_STEP_SUMMARY"


  slsa-report:
    name: 🛡️ slsa
    needs:
      - ref-build
      - release-build
      - github-release

    # For a ref event, release-build and prepare-release are skipped.
    # For a tag event, ref-build is skipped.
    # always() prevents those expected skips from automatically skipping
    # this job.
    if: |
      always() &&
      (
        needs['ref-build'].result == 'success' ||
        (
          needs['release-build'].result == 'success' &&
          needs['github-release'].result == 'success'
        )
      )

    runs-on: ${{ inputs.github-actions-runner }}
    timeout-minutes: 5

    permissions:
      contents: write
      packages: read
      attestations: read
      artifact-metadata: read
      pull-requests: write

    steps:
      - name: Resolve SLSA report inputs
        id: report_vars
        shell: bash
        env:
          REF_RESULT: ${{ needs['ref-build'].result }}
          REF_SUBJECT: ${{ needs['ref-build'].outputs.image_subject }}
          REF_IMAGE_BASE: ${{ needs['ref-build'].outputs.image_base }}
          REF_DIGEST: ${{ needs['ref-build'].outputs.image_digest }}
          REF_NAME: ${{ needs['ref-build'].outputs.effective_ref }}
          REF_TITLE: ${{ needs['ref-build'].outputs.report_title }}
          RELEASE_RESULT: ${{ needs['release-build'].result }}
          RELEASE_SUBJECT: ${{ needs['release-build'].outputs.image_subject }}
          RELEASE_IMAGE_BASE: ${{ needs['release-build'].outputs.image_base }}
          RELEASE_DIGEST: ${{ needs['release-build'].outputs.image_digest }}
          RELEASE_REF_NAME: ${{ needs['release-build'].outputs.effective_ref }}
          RELEASE_TITLE: ${{ needs['release-build'].outputs.report_title }}
        run: |
          set -euo pipefail

          if [ "${RELEASE_RESULT}" = "success" ]; then
            SUBJECT="${RELEASE_SUBJECT}"
            IMAGE_BASE="${RELEASE_IMAGE_BASE}"
            DIGEST="${RELEASE_DIGEST}"
            REF_NAME="${RELEASE_REF_NAME}"
            TITLE="${RELEASE_TITLE}"
            BUILD_TYPE="release"
          elif [ "${REF_RESULT}" = "success" ]; then
            SUBJECT="${REF_SUBJECT}"
            IMAGE_BASE="${REF_IMAGE_BASE}"
            DIGEST="${REF_DIGEST}"
            REF_NAME="${REF_NAME}"
            TITLE="${REF_TITLE}"
            BUILD_TYPE="ref"
          else
            echo "::error::No successful build is available for SLSA verification."
            exit 1
          fi

          if [ -z "${SUBJECT}" ] ||
             [ -z "${IMAGE_BASE}" ] ||
             [ -z "${DIGEST}" ] ||
             [ -z "${REF_NAME}" ]; then
            echo "::error::The successful build did not provide all required SLSA inputs."
            echo "::error::Subject: ${SUBJECT:-<empty>}"
            echo "::error::Image base: ${IMAGE_BASE:-<empty>}"
            echo "::error::Digest: ${DIGEST:-<empty>}"
            echo "::error::Ref name: ${REF_NAME:-<empty>}"
            exit 1
          fi

          if [ -z "${TITLE}" ]; then
            if [ "${BUILD_TYPE}" = "release" ]; then
              TITLE="SLSA verification (release build)"
            else
              TITLE="SLSA verification (merge/ref build)"
            fi
          fi

          {
            echo "subject=${SUBJECT}"
            echo "image_base=${IMAGE_BASE}"
            echo "digest=${DIGEST}"
            echo "ref_name=${REF_NAME}"
            echo "title=${TITLE}"
            echo "build_type=${BUILD_TYPE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🛡️ SLSA report inputs"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Build type | \`${BUILD_TYPE}\` |"
            echo "| Ref | \`${REF_NAME}\` |"
            echo "| Image | \`${IMAGE_BASE}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Subject | \`${SUBJECT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One verifier for every mechanism (ohanalabs-ai/actions PR #3):
      #   github -> gh attestation verify;  cosign -> cosign verify (+ verify-attestation);
      #   auto   -> GitHub first, cosign fallback. attestations-pushed tells it whether a
      #   missing GitHub attestation is informational (❕) or a failure (❌).
      - name: Verify SLSA provenance
        id: report
        if: env.ATTEST_MODE != 'vault'
        uses: ohanalabs-ai/actions/docker/slsa-report@main
        with:
          subject: ${{ steps.report_vars.outputs.subject }}
          image-base: ${{ steps.report_vars.outputs.image_base }}
          digest: ${{ steps.report_vars.outputs.digest }}
          signer-workflow: ${{ inputs.slsa-signer-workflow }}
          slsa-build-level: ${{ inputs.slsa-build-level }}
          ref-name: ${{ steps.report_vars.outputs.ref_name }}
          title: ${{ steps.report_vars.outputs.title }}
          mechanism: ${{ env.ATTEST_MODE == 'none' && 'github' || env.ATTEST_MODE }}
          attestations-pushed: ${{ env.PUSH_ATTESTATIONS }}
          cosign-identity-regexp: ${{ env.ATTEST_MODE != 'github' && format('^https://github.com/{0}@', inputs.slsa-signer-workflow) || '' }}
          fail-on-unverified: "true"

      # attestation-mode vault: re-verify in THIS job, which has no Vault access — only the PUBLIC
      # key the build exported + the registry. Same checks as admission (signature, SLSA provenance,
      # the org's approved-build CUE). Emits the slsa-report outputs, so the steps below are shared.
      - name: Checkout this reusable's helpers (at the reusable's own commit)
        if: env.ATTEST_MODE == 'vault'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ohanalabs-ai/github-platform
          ref: ${{ job.workflow_sha || github.job_workflow_sha }}
          path: .vault-sign
          sparse-checkout: actions/docker/vault-sign
          persist-credentials: false

      - name: Install cosign (vault verification)
        if: env.ATTEST_MODE == 'vault'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🛡️ Verify the Vault Transit signature + provenance (public key only)
        id: report_vault
        if: env.ATTEST_MODE == 'vault'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SUBJECT: ${{ steps.report_vars.outputs.subject }}
          SIGNED: ${{ steps.report_vars.outputs.build_type == 'release' && needs['release-build'].outputs.vault_signed || needs['ref-build'].outputs.vault_signed }}
          SIGN_REASON: ${{ steps.report_vars.outputs.build_type == 'release' && needs['release-build'].outputs.vault_reason || needs['ref-build'].outputs.vault_reason }}
          KEY_REF: ${{ steps.report_vars.outputs.build_type == 'release' && needs['release-build'].outputs.vault_key_ref || needs['ref-build'].outputs.vault_key_ref }}
          PUBLIC_KEY_B64: ${{ steps.report_vars.outputs.build_type == 'release' && needs['release-build'].outputs.vault_public_key_b64 || needs['ref-build'].outputs.vault_public_key_b64 }}
          ORG: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ inputs.slsa-signer-workflow }}
          SLSA_BUILD_LEVEL: ${{ inputs.slsa-build-level }}
          TITLE: ${{ steps.report_vars.outputs.title }}
          FAIL_ON_UNVERIFIED: "true"
        with:
          script: |
            const { default: run } = await import(`${process.env.GITHUB_WORKSPACE}/.vault-sign/actions/docker/vault-sign/verify.ts`);
            await run({ core, exec, github, context });

      - name: Summarize verification result
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.report_vars.outputs.build_type }}
          REF_NAME: ${{ steps.report_vars.outputs.ref_name }}
          SUBJECT: ${{ steps.report_vars.outputs.subject }}
          MODE: ${{ steps.report.outputs.attested_by || steps.report_vault.outputs.attested_by }}
          STATUS: ${{ steps.report.outputs.status || steps.report_vault.outputs.status }}
          VERIFIED: ${{ steps.report.outputs.verified || steps.report_vault.outputs.verified }}
          DECLARED_SLSA_BUILD_LEVEL: ${{ steps.report.outputs.declared_slsa_build_level || steps.report_vault.outputs.declared_slsa_build_level }}
          REPORT: ${{ steps.report.outputs.summary_markdown || steps.report_vault.outputs.summary_markdown }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          WORKFLOW_RUN_URL="${REPOSITORY_URL}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo ""
            echo "## SLSA verification result"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Build type | \`${BUILD_TYPE}\` |"
            echo "| Ref | \`${REF_NAME}\` |"
            echo "| Attested by | \`${MODE}\` (${STATUS}) |"
            echo "| Verified | \`${VERIFIED}\` |"
            echo "| Subject | \`${SUBJECT}\` |"
            echo "| Workflow run | [View workflow run](${WORKFLOW_RUN_URL}) |"
            echo "| Declared SLSA Build level | \`${DECLARED_SLSA_BUILD_LEVEL}\` |"
            echo ""
            printf '%s\n' "${REPORT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment merged PR with SLSA report
        if: |
          steps.report_vars.outputs.build_type == 'ref' &&
          needs['ref-build'].outputs.comment_enabled == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          IMAGE: ${{ steps.report_vars.outputs.image_base }}
          DIGEST: ${{ steps.report_vars.outputs.digest }}
          SUBJECT: ${{ steps.report_vars.outputs.subject }}
          REF_NAME: ${{ steps.report_vars.outputs.ref_name }}
          PR_NUMBER: ${{ needs['ref-build'].outputs.pr_number }}
          IMAGE_TAG: ${{ needs['ref-build'].outputs.image_tag }}
          IMAGE_SUFFIX: ${{ needs['ref-build'].outputs.image_suffix }}
          VERIFIED: ${{ steps.report.outputs.verified || steps.report_vault.outputs.verified }}
          ATTESTED_BY: ${{ steps.report.outputs.attested_by || steps.report_vault.outputs.attested_by }}
          STATUS: ${{ steps.report.outputs.status || steps.report_vault.outputs.status }}
          SLSA_REPORT: ${{ steps.report.outputs.summary_markdown || steps.report_vault.outputs.summary_markdown }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const suffix = process.env.IMAGE_SUFFIX;
            const marker = `<!-- docker-meta${suffix ? ': ' + suffix : ''} -->`;

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed(
                `Invalid pull request number: ${process.env.PR_NUMBER}`
              );
              return;
            }

            const image = process.env.IMAGE;
            const imageTag = process.env.IMAGE_TAG.trim();
            const [, org, pkgPath] = image.match(/ghcr\.io\/([^/]+)\/(.+)/) || [];
            const encoded = pkgPath ? pkgPath.split('/').map(encodeURIComponent).join('%2F') : '';
            const packageUrl = org
              ? `https://github.com/orgs/${org}/packages/container/package/${encoded}`
              : `${context.serverUrl}/${owner}/${repo}/pkgs/container/${encodeURIComponent(repo)}`;
            const workflowRunUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              `## Docker image metadata — \`${imageTag}\``,
              '',
              '| Property | Value |',
              '|---|---|',
              `| Ref | \`${process.env.REF_NAME}\` |`,
              `| Image | [${image}](${packageUrl}) |`,
              `| Digest | \`${process.env.DIGEST}\` |`,
              `| Subject | \`${process.env.SUBJECT}\` |`,
              `| Provenance | ${process.env.VERIFIED === 'true' ? '✅ verified (' + process.env.ATTESTED_BY + ')' : (process.env.STATUS === 'not-attested' ? '❕ not attested (informational)' : '❌ verification failed')} |`,
              `| Workflow run | [View verification run](${workflowRunUrl}) |`,
              '',
              '**Tags**',
              '```',
              imageTag,
              '```',
              '',
              process.env.SLSA_REPORT || '',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              }
            );

            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });

              core.notice(
                `Updated SLSA report on pull request #${issueNumber}.`
              );
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });

              core.notice(
                `Added SLSA report to pull request #${issueNumber}.`
              );
            }

      - name: Add SLSA report and publish GitHub release
        if: |
          steps.report_vars.outputs.build_type == 'release' &&
          (steps.report.outputs.verified || steps.report_vault.outputs.verified) == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RELEASE_ID: ${{ needs['github-release'].outputs.release_id }}
          RELEASE_URL: ${{ needs['github-release'].outputs.release_url }}
          TAG_NAME: ${{ steps.report_vars.outputs.ref_name }}
          IMAGE: ${{ steps.report_vars.outputs.image_base }}
          DIGEST: ${{ steps.report_vars.outputs.digest }}
          SUBJECT: ${{ steps.report_vars.outputs.subject }}
          VERIFIED: ${{ steps.report.outputs.verified || steps.report_vault.outputs.verified }}
          SLSA_REPORT: ${{ steps.report.outputs.summary_markdown || steps.report_vault.outputs.summary_markdown }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const tag = process.env.TAG_NAME;

            if (!Number.isInteger(releaseId) || releaseId <= 0) {
              core.setFailed(
                `Invalid GitHub Release ID: ${process.env.RELEASE_ID}`
              );
              return;
            }

            const repositoryUrl =
              `${context.serverUrl}/${owner}/${repo}`;
            const tagUrl =
              `${repositoryUrl}/releases/tag/${encodeURIComponent(tag)}`;
            const packageUrl =
              `${repositoryUrl}/pkgs/container/${encodeURIComponent(repo)}`;
            const workflowRunUrl =
              `${repositoryUrl}/actions/runs/${context.runId}`;

            const markerStart = '<!-- slsa-report:start -->';
            const markerEnd = '<!-- slsa-report:end -->';

            const response = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId
            });

            const release = response.data;

            if (release.tag_name !== tag) {
              core.setFailed(
                `Prepared release tag ${release.tag_name} does not match ` +
                `the verified tag ${tag}.`
              );
              return;
            }

            const slsaSection = `${markerStart}
            ## 🛡️ SLSA verification

            | Property | Value |
            |---|---|
            | Status | ✅ Verified |
            | Tag | [\`${tag}\`](${tagUrl}) |
            | Container package | [\`${process.env.IMAGE}\`](${packageUrl}) |
            | Digest | \`${process.env.DIGEST}\` |
            | Subject | \`${process.env.SUBJECT}\` |
            | Workflow run | [View verification run](${workflowRunUrl}) |

            ${process.env.SLSA_REPORT || ''}

            ${markerEnd}`;

            const escapeRegex = value =>
              value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const existingSection = new RegExp(
              `${escapeRegex(markerStart)}[\\s\\S]*?${escapeRegex(markerEnd)}`,
              'm'
            );

            const currentBody = release.body || '';

            const body = existingSection.test(currentBody)
              ? currentBody.replace(existingSection, slsaSection)
              : `${currentBody.trimEnd()}

            ${slsaSection}`.trim();

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              body,
              draft: false
            });

            core.notice(
              `Published verified release ${tag}: ` +
              `${process.env.RELEASE_URL || tagUrl}`
            );
