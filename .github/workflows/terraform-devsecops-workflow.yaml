# 🌎 Reusable Terraform DevSecOps workflow — lint/validate, an optional
# shift-left security scan (tfsec + terrascan), a plan step that comments the
# result directly on the PR, and an environment-gated apply.
#
# This is a reviewed, genericized copy of
# vionix-proj/vionix-github's .github/workflows/terraform-devsecops-workflow.yaml.
# See products/devsecops-terraform/README.md in this repo for usage and an
# explicit list of what changed from the original and why:
#
#   - Dropped the private `Viasat/vionix/actions/build/config-stream-decoder`
#     action and the `ARTIFACTORY_SVC_USER`/`ARTIFACTORY_SVC_PASS` secrets —
#     replaced with standard AWS OIDC (`aws-actions/configure-aws-credentials`)
#     so any repo with a GitHub OIDC trust relationship can call this, not
#     just repos with access to Viasat-internal Artifactory.
#   - Dropped the `docker compose run terraform-*` service-name contract (it
#     required every caller to ship a docker-compose.yaml with services named
#     exactly `terraform-validate`/`terraform-plan`/`terraform-apply`/
#     `terraform-tfsec`) — replaced with `hashicorp/setup-terraform` + plain
#     `terraform` CLI, so any repo with a Terraform root module can call this
#     with no extra contract.
#   - Dropped the custom `vionix` self-hosted runner default in favor of
#     `ubuntu-latest`, matching this repo's other reusable workflows
#     (docker-multiarch-cicd.yaml, actions-pin-version-setting-lint.yaml) —
#     still overridable via `github-actions-runner`.
#   - The tfsec SARIF upload from the original depended on a
#     `terraform-check.sarif.json` file produced by the removed docker step;
#     that step is not reproduced here (tfsec's own SARIF output would need
#     wiring in a follow-up — see the README). tfsec's PR-comment path and
#     terrascan's SARIF upload are both self-contained and kept as-is.
#   - Declared `SLACK_CHANNEL_AUTOMATION_ID`/`_TOKEN` secrets existed in the
#     original but were never referenced by any step in its body — dropped
#     as dead declarations rather than carried forward unused.
#   - Added `run-deploy` (default false): the original's `deploy` job (like
#     this one) has no `if:` gate of its own — it relies entirely on the
#     target GitHub Environment's own protection rules to pause `apply`.
#     That's a single point of failure if that Environment is ever
#     misconfigured or doesn't exist yet (GitHub auto-creates an unprotected
#     Environment on first use). `run-deploy` is a second, independent,
#     structural gate: it must be explicitly set true for the deploy job to
#     even attempt to run, regardless of Environment config.
#   - Added a `destroy` job (`run-destroy`, same gating shape as `deploy`) —
#     generalized from an inline `terraform destroy` job a caller
#     (planeodev/eks-cluster) had kept locally only because this workflow
#     didn't support destroy yet. Mutually exclusive with `run-deploy`.
#   - Added `expected-deploy-events` (default "workflow_dispatch"): a third,
#     structural gate on deploy/destroy, independent of whatever the
#     caller's own run-deploy/run-destroy expression computed.
#   - Added `agent-validated`: lets a caller that already validated the plan
#     itself (e.g. an agent) skip the target Environment's required-reviewer
#     pause. Does NOT duplicate the deploy/destroy jobs to do this — a job's
#     environment: block can't be conditionally omitted at runtime, but its
#     NAME can be an expression, so deploy/destroy point at
#     "<terraform-environment-name>-unattended" instead of
#     "<terraform-environment-name>" when agent-validated is true. That
#     derived name has no protection rules unless the calling repo
#     deliberately adds them.
name: 🌎 terraform-devsecops-workflow

on:
  workflow_call:
    inputs:
      github-actions-runner:
        description: "Runner to use for every job in this workflow"
        required: false
        type: string
        default: ubuntu-latest

      working-directory:
        description: "Directory containing the Terraform root module"
        required: false
        type: string
        default: terraform

      terraform-version:
        description: "Terraform CLI version to install via hashicorp/setup-terraform"
        required: false
        type: string
        default: "1.9.8"

      backend-config:
        description: >-
          Backend config lines (e.g. bucket/key/region/dynamodb_table for an
          S3 backend), one per line, written to a generated backend.hcl
          before `terraform init`. Leave empty to init without a remote
          backend (e.g. for a repo that only wants lint/validate/check).
        required: false
        type: string
        default: ""

      var-file:
        description: "Path, relative to working-directory, to a .tfvars file passed as -var-file. Empty for none."
        required: false
        type: string
        default: ""

      extra-args:
        description: "Extra space-separated -var=... (or other) flags appended to plan/apply"
        required: false
        type: string
        default: ""

      aws-region:
        description: "AWS region for OIDC auth. Leave both this and aws-role-arn empty to skip AWS auth entirely."
        required: false
        type: string
        default: ""

      aws-role-arn:
        description: "IAM role ARN to assume via GitHub OIDC. Leave both this and aws-region empty to skip AWS auth entirely."
        required: false
        type: string
        default: ""

      enable-shift-left-scan:
        description: "Run the tfsec/terrascan security-scan matrix job."
        required: false
        type: boolean
        default: false

      terrascan-config-path:
        description: "Path to terrascan's config file, only read when enable-shift-left-scan is true"
        required: false
        type: string
        default: terrascan-config.toml

      terraform-environment-name:
        description: "GitHub Environment the deploy job runs under (Settings -> Environments) — use this for required-reviewer apply gating"
        required: false
        type: string
        default: default

      terraform-environment-url:
        description: "URL shown on a successful deployment in the GitHub UI. Empty to omit."
        required: false
        type: string
        default: ""

      run-deploy:
        description: >-
          Explicit opt-in to run the deploy (terraform apply) job at all.
          Defaults to false so a plan-only invocation (e.g. from a PR) can
          never reach apply regardless of the target GitHub Environment's
          own protection rules — those are a second, independent gate, not
          the only one. Set true only from a workflow_dispatch (or
          equivalent) path that a human explicitly triggered for an apply.
        required: false
        type: boolean
        default: false

      run-destroy:
        description: >-
          Explicit opt-in to run the destroy (terraform destroy) job at all.
          Same shape and same reasoning as run-deploy — a second, independent
          gate on top of the target Environment's own protection rules.
          run-deploy and run-destroy are mutually exclusive; validate-inputs
          fails fast if both are true. Set true only from a workflow_dispatch
          (or equivalent) path a human explicitly triggered for a destroy.
        required: false
        type: boolean
        default: false

      expected-deploy-events:
        description: >-
          Comma-separated allowlist of github.event_name values deploy/destroy
          are permitted to run under, checked in addition to run-deploy/
          run-destroy — a third, structural gate independent of what the
          caller's own run-deploy/run-destroy expression computed. Default
          "workflow_dispatch" only. IMPORTANT if adding "pull_request": a
          pull_request event's github.ref is refs/pull/<N>/merge, never
          refs/heads/<branch> — it will NEVER satisfy a GitHub Environment's
          "restrict to branch main" deployment-branch policy. To actually
          deploy once code lands on main, use a `push` (branches: [main])
          trigger instead and include "push" here, not "pull_request".
        required: false
        type: string
        default: workflow_dispatch

      agent-validated:
        description: >-
          Explicit bypass of the target Environment's required-reviewer
          pause, for an automated caller (e.g. an agent) that has already
          validated the plan itself and is not a human waiting at a "Review
          deployments" prompt. Mechanism: deploy/destroy reference
          "<terraform-environment-name>-unattended" instead of
          "<terraform-environment-name>" when this is true — same job, a
          different (by default unprotected) Environment name, not a
          duplicated job. Does NOT bypass run-deploy/run-destroy or
          expected-deploy-events — those still gate whether this runs at
          all. Restricting WHO may set this to true is the CALLING repo's
          responsibility (e.g. restrict which actors/branches can trigger
          workflow_dispatch at all) — this workflow only provides the
          mechanism, not caller-identity enforcement.
        required: false
        type: boolean
        default: false

    secrets:
      extra-env-json:
        description: >-
          Optional JSON object of {ENV_VAR: value} pairs, exported as masked
          env vars before terraform init/plan/apply. For any provider beyond
          AWS that this Terraform config needs credentials for (e.g. a
          Tailscale provider needing TAILSCALE_OAUTH_CLIENT_ID/_SECRET) —
          verified live: eks-cluster's config also configures a tailscale
          provider, and without a way to pass its credentials through,
          terraform plan correctly errored with "Provider credentials
          error" (a real, expected failure, not a bug in this workflow).
        required: false

permissions:
  contents: read
  id-token: write # for aws-actions/configure-aws-credentials (OIDC) — no-op if aws-role-arn is empty

jobs:
  validate-inputs:
    name: 🔍 validate-inputs
    runs-on: ${{ inputs.github-actions-runner }}
    steps:
      - name: Check aws-region/aws-role-arn are both set or both empty
        if: ${{ (inputs.aws-region != '' && inputs.aws-role-arn == '') || (inputs.aws-region == '' && inputs.aws-role-arn != '') }}
        run: |
          echo "::error::aws-region and aws-role-arn must either both be set (to enable AWS OIDC auth) or both be empty (to skip it) — got aws-region='${{ inputs.aws-region }}' aws-role-arn='${{ inputs.aws-role-arn }}'"
          exit 1

      - name: Check enable-shift-left-scan has a config path
        if: ${{ inputs.enable-shift-left-scan && inputs.terrascan-config-path == '' }}
        run: |
          echo "::error::terrascan-config-path cannot be empty when enable-shift-left-scan is true"
          exit 1

      - name: Check run-deploy and run-destroy are not both true
        if: ${{ inputs.run-deploy && inputs.run-destroy }}
        run: |
          echo "::error::run-deploy and run-destroy cannot both be true in the same invocation — pick one"
          exit 1

  lint:
    name: 🚨 lint
    needs: [validate-inputs]
    runs-on: ${{ inputs.github-actions-runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          # The wrapper script (the default) captures terraform's exit code
          # as a step OUTPUT but does not propagate it as the step's own
          # exit status -- a real `terraform plan`/`apply` error would still
          # report the step (and job) as successful. Verified live: a plan
          # that hit "Error: Provider credentials error" and exited 1 was
          # still reported success by the wrapped step. Disabling the
          # wrapper makes the raw terraform binary's exit code propagate
          # natively.
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: ${{ inputs.working-directory }}
        run: terraform fmt -check -recursive

      - name: terraform init (no backend) + validate
        working-directory: ${{ inputs.working-directory }}
        run: |
          terraform init -backend=false
          terraform validate

  check:
    name: 🛡️️ check
    if: ${{ inputs.enable-shift-left-scan }}
    needs: [lint]
    runs-on: ${{ inputs.github-actions-runner }}
    strategy:
      fail-fast: false
      matrix:
        checkType: [terrascan, tfsec]
    permissions:
      contents: read
      pull-requests: write
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Add tfsec comments to PR
        if: ${{ matrix.checkType == 'tfsec' }}
        uses: aquasecurity/tfsec-pr-commenter-action@7a44c5dcde5dfab737363e391800629e27b6376b # v1.3.1
        with:
          soft_fail_commenter: true
          working_directory: ${{ inputs.working-directory }}
          github_token: ${{ github.token }}

      - name: Run Terrascan
        if: ${{ matrix.checkType == 'terrascan' }}
        id: terrascan
        uses: tenable/terrascan-action@dd7e921056c6f25b25bff3cf791e063ed7fc3a78 # v1.5.0
        with:
          iac_type: 'terraform'
          iac_dir: ${{ inputs.working-directory }}
          policy_type: 'aws'
          only_warn: true
          sarif_upload: true
          config_path: ${{ inputs.terrascan-config-path }}

      - name: Upload SARIF file for terrascan
        if: ${{ matrix.checkType == 'terrascan' }}
        uses: github/codeql-action/upload-sarif@820e3160e279568db735cee8ed8f8e77a6da7818 # v3.32.6
        with:
          sarif_file: terrascan.sarif
          category: terrascan

  plan:
    name: 📝️ plan
    needs: [lint]
    runs-on: ${{ inputs.github-actions-runner }}
    strategy:
      fail-fast: true
    env:
      TF_IN_AUTOMATION: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write # job-level permissions REPLACE, not merge with, the workflow-level default above -- must be repeated here for aws-actions/configure-aws-credentials to get a token
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          # The wrapper script (the default) captures terraform's exit code
          # as a step OUTPUT but does not propagate it as the step's own
          # exit status -- a real `terraform plan`/`apply` error would still
          # report the step (and job) as successful. Verified live: a plan
          # that hit "Error: Provider credentials error" and exited 1 was
          # still reported success by the wrapped step. Disabling the
          # wrapper makes the raw terraform binary's exit code propagate
          # natively.
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        if: ${{ inputs.aws-role-arn != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Export extra-env-json as masked env vars
        # The `secrets` context is not allowed in step `if:` expressions
        # (confirmed via actionlint — using it there makes the whole
        # workflow file fail GitHub's static validation, with zero jobs
        # ever created). Always run the step; check emptiness inside the
        # script instead, where secrets are just interpolated text.
        shell: bash
        run: |
          set -euo pipefail
          JSON='${{ secrets.extra-env-json }}'
          if [ -n "$JSON" ]; then
            echo "$JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r key value; do
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done
          fi

      - name: Write backend.hcl
        if: ${{ inputs.backend-config != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          cat > backend.hcl <<'EOF'
          ${{ inputs.backend-config }}
          EOF

      - name: terraform init
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f backend.hcl ]; then
            terraform init -backend-config=backend.hcl
          else
            terraform init
          fi

      - name: terraform plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          VAR_FILE_ARG=""
          if [ -n "${{ inputs.var-file }}" ]; then
            VAR_FILE_ARG="-var-file=${{ inputs.var-file }}"
          fi
          terraform plan -no-color -out=plan.tfplan $VAR_FILE_ARG ${{ inputs.extra-args }} | tee plan.txt

      - name: Convert plan to markdown
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: reproio/terraform-j2md@92a5431c6a32baf8321bc57c9408f3972b161a77 # v0.0.9
        with:
          version: v0.0.9

      - name: Render plan summary
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          terraform show -json plan.tfplan | terraform-j2md > terraform-plan.md
          {
            echo "📝️ Terraform plan"
            echo ""
            cat terraform-plan.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add plan to PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: ${{ inputs.working-directory }}/terraform-plan.md

  deploy:
    name: 🚀 deploy
    if: ${{ inputs.run-deploy && contains(format(',{0},', inputs.expected-deploy-events), format(',{0},', github.event_name)) }}
    needs: [plan]
    runs-on: ${{ inputs.github-actions-runner }}
    # A job's environment: block can't be conditionally OMITTED at runtime
    # (only VALUES inside an existing key can be expressions) -- so
    # agent-validated doesn't duplicate this job, it instead points the same
    # job at a DIFFERENT environment name: "<terraform-environment-name>-unattended".
    # That name has no protection rules unless the calling repo deliberately
    # adds them (GitHub auto-creates an environment unprotected on first
    # reference), so a run through it doesn't pause for review. Restricting
    # WHO may set agent-validated true is still the calling repo's own
    # responsibility (see that input's description).
    environment:
      name: ${{ inputs.agent-validated && format('{0}-unattended', inputs.terraform-environment-name) || inputs.terraform-environment-name }}
      url: ${{ inputs.terraform-environment-url }}
    env:
      TF_IN_AUTOMATION: true
    permissions:
      contents: read
      id-token: write # job-level permissions REPLACE, not merge with, the workflow-level default -- must be repeated here for aws-actions/configure-aws-credentials to get a token
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          # The wrapper script (the default) captures terraform's exit code
          # as a step OUTPUT but does not propagate it as the step's own
          # exit status -- a real `terraform plan`/`apply` error would still
          # report the step (and job) as successful. Verified live: a plan
          # that hit "Error: Provider credentials error" and exited 1 was
          # still reported success by the wrapped step. Disabling the
          # wrapper makes the raw terraform binary's exit code propagate
          # natively.
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        if: ${{ inputs.aws-role-arn != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Export extra-env-json as masked env vars
        # The `secrets` context is not allowed in step `if:` expressions
        # (confirmed via actionlint — using it there makes the whole
        # workflow file fail GitHub's static validation, with zero jobs
        # ever created). Always run the step; check emptiness inside the
        # script instead, where secrets are just interpolated text.
        shell: bash
        run: |
          set -euo pipefail
          JSON='${{ secrets.extra-env-json }}'
          if [ -n "$JSON" ]; then
            echo "$JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r key value; do
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done
          fi

      - name: Write backend.hcl
        if: ${{ inputs.backend-config != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          cat > backend.hcl <<'EOF'
          ${{ inputs.backend-config }}
          EOF

      - name: terraform init
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f backend.hcl ]; then
            terraform init -backend-config=backend.hcl
          else
            terraform init
          fi

      - name: terraform apply
        working-directory: ${{ inputs.working-directory }}
        run: |
          VAR_FILE_ARG=""
          if [ -n "${{ inputs.var-file }}" ]; then
            VAR_FILE_ARG="-var-file=${{ inputs.var-file }}"
          fi
          terraform apply -auto-approve -no-color $VAR_FILE_ARG ${{ inputs.extra-args }}

  destroy:
    name: 🧨 destroy
    if: ${{ inputs.run-destroy && contains(format(',{0},', inputs.expected-deploy-events), format(',{0},', github.event_name)) }}
    needs: [plan]
    runs-on: ${{ inputs.github-actions-runner }}
    # Same agent-validated-picks-a-different-environment-name mechanism as
    # deploy above -- see its comment for why this isn't a duplicated job.
    environment:
      name: ${{ inputs.agent-validated && format('{0}-unattended', inputs.terraform-environment-name) || inputs.terraform-environment-name }}
      url: ${{ inputs.terraform-environment-url }}
    env:
      TF_IN_AUTOMATION: true
    permissions:
      contents: read
      id-token: write # job-level permissions REPLACE, not merge with, the workflow-level default -- must be repeated here for aws-actions/configure-aws-credentials to get a token
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        if: ${{ inputs.aws-role-arn != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Export extra-env-json as masked env vars
        shell: bash
        run: |
          set -euo pipefail
          JSON='${{ secrets.extra-env-json }}'
          if [ -n "$JSON" ]; then
            echo "$JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r key value; do
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done
          fi

      - name: Write backend.hcl
        if: ${{ inputs.backend-config != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          cat > backend.hcl <<'EOF'
          ${{ inputs.backend-config }}
          EOF

      - name: terraform init
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f backend.hcl ]; then
            terraform init -backend-config=backend.hcl
          else
            terraform init
          fi

      - name: terraform destroy
        working-directory: ${{ inputs.working-directory }}
        run: |
          VAR_FILE_ARG=""
          if [ -n "${{ inputs.var-file }}" ]; then
            VAR_FILE_ARG="-var-file=${{ inputs.var-file }}"
          fi
          terraform destroy -auto-approve -no-color $VAR_FILE_ARG ${{ inputs.extra-args }}
