name: 🔒 vault revoke-token
description: Revoke the job's Vault token (auth/token/revoke-self). Run with `if: always()` at the end of a job that logged in.
runs:
  using: composite
  steps:
    - name: 🔒 Vault token revoke-self
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        HELPERS: ${{ github.action_path }}/../lib
        MODE: revoke
      with:
        script: |
          const { default: run } = await import(`${process.env.HELPERS}/config-stream.ts`);
          await run({ core, exec, github, context });
