name: 🔑 vault get-config-stream
description: >-
  Read the vionix-cicd CONFIG_STREAM_KEY from Vault (the path is derived from where the workflow runs),
  mask it and export env CONFIG_STREAM_KEY. If CONFIG_STREAM_KEY is already in the env (the org-secret
  copy) and prefer-existing is true, Vault is not called. Needs VAULT_ADDR + VAULT_TOKEN otherwise.
inputs:
  kv-mount:
    description: KV v2 mount
    required: false
    default: planeo
  prefer-existing:
    description: "true = use an already-set env CONFIG_STREAM_KEY instead of calling Vault"
    required: false
    default: "true"
  github-org:
    description: Override the org (default github.repository_owner)
    required: false
    default: ""
  github-host:
    description: Override the GitHub host (default from GITHUB_SERVER_URL)
    required: false
    default: ""
outputs:
  path:
    description: The Vault path (no value)
    value: ${{ steps.get.outputs.path }}
  source:
    description: "vault | env"
    value: ${{ steps.get.outputs.source }}
runs:
  using: composite
  steps:
    - name: 🔑 config-stream key — get
      id: get
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        HELPERS: ${{ github.action_path }}/../lib
        MODE: get
        KV_MOUNT: ${{ inputs.kv-mount }}
        PREFER_EXISTING: ${{ inputs.prefer-existing }}
        GITHUB_ORG_OVERRIDE: ${{ inputs.github-org }}
        GITHUB_HOST_OVERRIDE: ${{ inputs.github-host }}
      with:
        script: |
          const { default: run } = await import(`${process.env.HELPERS}/config-stream.ts`);
          await run({ core, exec, github, context });
