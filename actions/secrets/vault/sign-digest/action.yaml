name: 🔏 vault sign-digest
description: "Sign a canonical statement naming any sha256 digest with the org's Vault Transit key, then verify it locally with the key's public half. Needs a prior Vault login (hashicorp/vault-action exportToken) and VAULT_ADDR in the job env."
inputs:
  subject-digest:
    description: "The digest to sign (sha256:<64 lowercase hex>) — an image, a file, a release artifact"
    required: true
  subject-name:
    description: "What the digest is (e.g. ghcr.io/planeodev/x, release/v1.2.3.tar.gz) — recorded in the statement"
    required: true
  transit-key:
    description: "Vault Transit key (default <org>-ci-images)"
    required: false
    default: ""
  transit-path:
    description: Vault Transit mount path
    required: false
    default: transit
outputs:
  statement-b64:
    description: The signed statement (canonical JSON, base64)
    value: ${{ steps.sign.outputs.statement-b64 }}
  signature:
    description: "Vault signature `vault:v<N>:<base64 ASN.1 DER>` over SHA-256(statement)"
    value: ${{ steps.sign.outputs.signature }}
  key-version:
    description: Transit key version that signed
    value: ${{ steps.sign.outputs.key-version }}
  public-key-b64:
    description: The key version's PUBLIC key (PEM, base64) — verify with it, no Vault needed
    value: ${{ steps.sign.outputs.public-key-b64 }}
  verified:
    description: "true when the signature verified locally with the public key"
    value: ${{ steps.sign.outputs.verified }}
runs:
  using: composite
  steps:
    - name: 🔏 sign the statement + verify with the public key
      id: sign
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        HELPERS: ${{ github.action_path }}/../lib
        SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        SUBJECT_NAME: ${{ inputs.subject-name }}
        TRANSIT_KEY: ${{ inputs.transit-key != '' && inputs.transit-key || format('{0}-ci-images', github.repository_owner) }}
        TRANSIT_PATH: ${{ inputs.transit-path }}
      with:
        script: |
          const { default: run } = await import(`${process.env.HELPERS}/sign-digest.ts`);
          await run({ core, exec, github, context });
