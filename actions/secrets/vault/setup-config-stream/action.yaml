name: 🔑 vault setup-config-stream
description: >-
  Create (or, with rotate, replace) the vionix-cicd CONFIG_STREAM_KEY in Vault at
  <kv-mount>/global/<github-host>/<org>/platform/vionix/config-stream — the path is derived from where
  the workflow runs — and optionally push the same value as the org secret CONFIG_STREAM_KEY.
  Needs a prior Vault login that exported VAULT_ADDR + VAULT_TOKEN (hashicorp/vault-action exportToken).
inputs:
  kv-mount:
    description: KV v2 mount
    required: false
    default: planeo
  rotate:
    description: "true = replace an existing key (compare-and-set on its version). Default never overwrites."
    required: false
    default: "false"
  push-org-secret:
    description: "true = also set org secret CONFIG_STREAM_KEY (visibility private) with gh — needs org-admin-token"
    required: false
    default: "false"
  org-admin-token:
    description: A token with admin:org on the org (only for push-org-secret)
    required: false
    default: ""
  github-org:
    description: Override the org (default github.repository_owner)
    required: false
    default: ""
  github-host:
    description: Override the GitHub host (default from GITHUB_SERVER_URL)
    required: false
    default: ""
outputs:
  path:
    description: The Vault path written (no value)
    value: ${{ steps.setup.outputs.path }}
  created:
    description: "true when a key was created or rotated in this run"
    value: ${{ steps.setup.outputs.created }}
  version:
    description: KV version of the key
    value: ${{ steps.setup.outputs.version }}
runs:
  using: composite
  steps:
    - name: 🔑 config-stream key — setup
      id: setup
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        HELPERS: ${{ github.action_path }}/../lib
        MODE: setup
        KV_MOUNT: ${{ inputs.kv-mount }}
        ROTATE: ${{ inputs.rotate }}
        PUSH_ORG_SECRET: ${{ inputs.push-org-secret }}
        ORG_ADMIN_TOKEN: ${{ inputs.org-admin-token }}
        GITHUB_ORG_OVERRIDE: ${{ inputs.github-org }}
        GITHUB_HOST_OVERRIDE: ${{ inputs.github-host }}
      with:
        script: |
          const { default: run } = await import(`${process.env.HELPERS}/config-stream.ts`);
          await run({ core, exec, github, context });
