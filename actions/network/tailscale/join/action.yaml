name: 🌐 tailscale join (secretless)
description: >-
  Join the runner to the tailnet with a Tailscale OIDC FEDERATED IDENTITY — the job's GitHub OIDC token is
  exchanged for an ephemeral node key; no secret. Callers pass the org variables TS_FEDERATED_CLIENT_ID /
  TS_FEDERATED_AUDIENCE (identifiers, not secrets). Needs `permissions: id-token: write`.
inputs:
  oauth-client-id:
    description: Federated identity client id (org variable TS_FEDERATED_CLIENT_ID)
    required: true
  audience:
    description: Federated identity audience (org variable TS_FEDERATED_AUDIENCE)
    required: true
  tags:
    description: Node tags — must be granted by the federated identity
    required: false
    default: tag:ci
  args:
    description: >-
      Extra `tailscale up` flags. Do NOT pass --accept-routes: tailscale/github-action v4 always adds
      it (src/main.ts upArgs), and a second copy makes `tailscale up` fail with "invalid boolean flag
      accept-routes: flag provided multiple times" (planeodev/planeo-infra run 38454444989).
    required: false
    default: ""
  ping:
    description: Optional comma-separated hosts to ping until reachable (eventual consistency of a new peer)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: 🌐 tailscale/github-action (workload identity federation)
      id: join
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
      with:
        oauth-client-id: ${{ inputs.oauth-client-id }}
        audience: ${{ inputs.audience }}
        tags: ${{ inputs.tags }}
        args: ${{ inputs.args }}
        ping: ${{ inputs.ping }}

    # Every run publishes what it did, on every outcome (owner rule 2026-10-13).
    - name: 📋 tailnet join summary
      if: always()
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        HELPERS: ${{ github.action_path }}
        JOIN_OUTCOME: ${{ steps.join.outcome }}
        CLIENT_ID: ${{ inputs.oauth-client-id }}
        TAGS: ${{ inputs.tags }}
      with:
        script: |
          const { default: run } = await import(`${process.env.HELPERS}/summary.ts`);
          await run({ core, exec, github, context });
